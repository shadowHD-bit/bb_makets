<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Журнал событий — прототип</title>
<style>
:root{
  /* neutral scale — shared token names between current bb2 and the new-design concept */
  --text-strong:#171717;
  --text-sub:#5c5c5c;
  --text-soft:#a3a3a3;
  --text-disabled:#c7c7c7;
  --bg-app:#fafafa;
  --bg-white:#fff;
  --bg-weak:#f7f7f7;
  --bg-soft:#ebebeb;
  --stroke-soft:#ececec;
  --stroke-med:#e2e2e2;

  /* accent — bb2's real gradient is Tailwind purple-700 → purple-400 */
  --purple-50:#faf5ff; --purple-100:#f3e8ff; --purple-200:#e9d5ff; --purple-300:#d8b4fe;
  --purple-400:#c084fc; --purple-500:#a855f7; --purple-600:#9333ea; --purple-700:#7e22ce;
  --primary:#8b3ce0;
  --primary-hover:#7a2fd0;
  --primary-a10:rgba(139,60,224,.09);
  --primary-a14:rgba(139,60,224,.13);

  --success:#1fc16b; --success-bg:#e3f7ec; --success-dark:#0b4627;
  --warning:#fa7319; --warning-bg:#fff3eb; --warning-dark:#c77a12;
  --error:#fb3748; --error-bg:#ffebec; --error-dark:#a2131f;
  --info:#8b3ce0; --info-bg:#f5eefd;
  --faded:#8a8a8a; --faded-bg:#f2f2f2;

  --radius-6:6px;--radius-8:8px;--radius-10:10px;--radius-12:12px;--radius-16:16px;--radius-full:999px;
  --shadow-xs:0 1px 2px 0 rgba(10,13,20,.04);
  --shadow-sm:0 2px 4px 0 rgba(14,18,27,.03),0 6px 10px 0 rgba(14,18,27,.05);
  --shadow-pop:0 12px 24px 0 rgba(14,18,27,.10),0 1px 2px 0 rgba(14,18,27,.04);
  --font: -apple-system,"Segoe UI",ui-sans-serif,system-ui,sans-serif;
  --font-mono: ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --side-w:264px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg-app);color:var(--text-strong);font-family:var(--font);
  font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::placeholder{color:var(--text-soft)}
a{color:inherit}
.tabnum{font-variant-numeric:tabular-nums}
svg{display:block}

/* ============================================================ shell */
.shell{display:flex;min-height:100vh}

/* ============================================================ SIDEBAR — 1:1 replica, fully inert except Аккаунты / Внешние клиенты */
.side{
  width:var(--side-w);flex:0 0 var(--side-w);background:var(--bg-white);
  border-right:1px solid var(--stroke-soft);display:flex;flex-direction:column;height:100vh;
  position:sticky;top:0;
}
.side-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px}
.side-brand .mark{
  width:36px;height:36px;border-radius:var(--radius-full);flex:0 0 36px;
  background:linear-gradient(135deg,var(--purple-700),var(--purple-400));color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px;
}
.side-brand .who{min-width:0;flex:1}
.side-brand .name{font-size:14.5px;font-weight:600;color:var(--text-strong);line-height:1.25}
.side-brand .sub{font-size:11.5px;color:var(--text-soft);line-height:1.2;margin-top:1px}
.side-brand .expand{color:var(--text-soft);flex:0 0 16px;cursor:default}
.side-divider{border:0;border-top:1px solid var(--stroke-soft);margin:0 16px}

.side-scroll{flex:1;overflow-y:auto;padding:12px 12px 8px}
.side-group{margin-bottom:2px}
.side-group-label{
  font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-soft);padding:14px 8px 6px;
}
.side-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 8px;border:0;background:none;
  border-radius:var(--radius-8);font-size:13.5px;font-weight:500;color:var(--text-strong);
  text-align:left;cursor:default;-webkit-user-select:none;user-select:none;
}
.side-item .ic{width:17px;height:17px;flex:0 0 17px;color:var(--text-sub);display:flex;align-items:center;justify-content:center}
.side-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-item .chev{flex:0 0 12px;color:var(--text-soft)}
.side-item.group-open .ic,.side-item.group-open .lbl{color:var(--text-strong)}

.side-sub{display:flex;flex-direction:column;gap:1px;padding:2px 0 6px 6px;position:relative}
.side-sub .side-item{font-size:13px;padding:7px 8px 7px 10px}
.side-sub .side-item .ic{width:15px;height:15px;flex:0 0 15px}

.side-item.clickable{cursor:pointer}
.side-item.clickable:hover{background:var(--bg-weak)}
.side-item.clickable .mk{width:5px;height:5px;border-radius:99px;background:var(--purple-300);flex:0 0 5px;margin-left:4px;opacity:.9}
.side-item.nav-active .mk{background:var(--primary)}
.side-item.nav-active{
  background:var(--primary-a10);color:var(--primary);font-weight:500;
  box-shadow:inset 3px 0 0 0 var(--primary);border-radius:var(--radius-8);
}
.side-item.nav-active .ic{color:var(--primary)}

.side-foot{padding:12px}
.side-collapse{
  display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-soft);
  padding:8px 8px;cursor:default;
}

/* ============================================================ TOPBAR — 1:1 style, inert */
.topbar{
  height:56px;flex:0 0 56px;background:var(--bg-white);border-bottom:1px solid var(--stroke-soft);
  display:flex;align-items:center;justify-content:flex-end;padding:0 20px;position:sticky;top:0;z-index:5;
  gap:14px;
}
.lang-pill{
  display:flex;align-items:center;gap:6px;border:1px solid var(--stroke-med);border-radius:var(--radius-8);
  padding:6px 10px;font-size:12.5px;font-weight:500;color:var(--text-strong);cursor:default;
}
.lang-pill .flag{font-size:12px}
.lang-pill .chev{color:var(--text-soft);width:9px;height:9px}
.topbar-divider{width:1px;height:24px;background:var(--stroke-soft)}
.top-profile{display:flex;align-items:center;gap:9px;cursor:default}
.top-profile .av{
  width:32px;height:32px;border-radius:var(--radius-full);background:#ffe7c2;color:#a3660a;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;flex:0 0 32px;
  position:relative;
}
.top-profile .av .dot{position:absolute;bottom:-1px;right:-1px;width:8px;height:8px;border-radius:99px;background:var(--success);border:2px solid var(--bg-white)}
.top-profile .who .n{font-size:12.5px;font-weight:600;color:var(--text-strong);line-height:1.3}
.top-profile .who .e{font-size:11.5px;color:var(--text-soft);line-height:1.3}
.top-icon{width:30px;height:30px;border-radius:var(--radius-8);border:1px solid var(--stroke-med);display:flex;align-items:center;justify-content:center;color:var(--text-sub);cursor:default}

/* ============================================================ main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.stage{flex:1;padding:18px 20px 40px;width:100%}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:600;margin:0 0 3px;letter-spacing:-.01em}
.page-head p{margin:0;color:var(--text-sub);font-size:13px}
.page-actions{display:flex;gap:8px;flex-shrink:0}

/* Аккаунты — header card + segmented tabs (matches real bb2 screen) */
.acc-card{background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:20px;box-shadow:var(--shadow-xs);padding:22px 24px 16px;margin-bottom:14px}
.acc-card h1{font-size:19px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.acc-card p.sub{margin:0;color:var(--text-sub);font-size:12.5px}
.acc-hr{border:0;border-top:1px solid var(--stroke-soft);margin:16px 0 14px}
.seg-tabs{display:inline-flex;gap:2px;background:var(--bg-weak);padding:4px;border-radius:12px}
.seg-tab{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:500;color:var(--text-sub);cursor:pointer;border:0;background:none;white-space:nowrap}
.seg-tab:hover:not(.active):not(.locked){color:var(--text-strong)}
.seg-tab.active{background:var(--bg-white);color:var(--text-strong);box-shadow:var(--shadow-xs)}
.seg-tab.locked{color:var(--text-disabled);cursor:not-allowed}
.info-row{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-sub);font-weight:500;cursor:pointer;margin-bottom:14px;-webkit-user-select:none;user-select:none}
.info-row .chev{transition:transform .15s;color:var(--text-soft)}
.info-row.open .chev{transform:rotate(180deg)}
.info-panel{max-height:0;overflow:hidden;transition:max-height .18s ease}
.info-panel.open{max-height:120px}
.info-panel-inner{font-size:12.5px;color:var(--text-sub);background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-12);padding:12px 14px;margin:-6px 0 14px;line-height:1.6}
.namelink{color:var(--primary);font-weight:500;cursor:pointer;text-decoration:none}
.namelink:hover{text-decoration:underline}
.idlink{color:var(--primary);font-weight:500;font-family:var(--font-mono);font-size:11.5px;cursor:pointer;text-decoration:none}
.idlink:hover{text-decoration:underline}
.pagfoot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--stroke-soft);font-size:12px;color:var(--text-soft)}
.pagfoot .select{padding:5px 24px 5px 10px;font-size:12px}

.btn{
  display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-8);border:1px solid var(--stroke-med);
  background:var(--bg-white);color:var(--text-strong);font-size:12.5px;font-weight:500;padding:7px 13px;
  cursor:pointer;box-shadow:var(--shadow-xs);transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--bg-weak);border-color:#d4d4d4}
.btn:active{background:var(--bg-soft)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn-ghost:hover{background:var(--bg-weak)}
.btn-danger{color:var(--error-dark);border-color:#ffd0d4}
.btn-danger:hover{background:var(--error-bg)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--bg-white)}

.incident{
  display:flex;align-items:flex-start;gap:10px;background:var(--warning-bg);border:1px solid #ffe0c2;
  border-radius:var(--radius-10);padding:11px 14px;margin-bottom:16px;font-size:12.5px;color:var(--warning-dark);
}
.incident .dotpulse{width:8px;height:8px;border-radius:99px;background:var(--warning);margin-top:4px;flex:0 0 8px;
  box-shadow:0 0 0 0 rgba(250,115,25,.5);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(250,115,25,.45)}70%{box-shadow:0 0 0 7px rgba(250,115,25,0)}100%{box-shadow:0 0 0 0 rgba(250,115,25,0)}}
.incident b{color:var(--warning-dark)}
.incident .msg{flex:1}
.incident .link{color:var(--warning-dark);font-weight:600;text-decoration:underline;cursor:pointer;white-space:nowrap}

/* record-detail tab bar (mirrors real bb2 user-card tabs) */
.rtabs{display:flex;gap:2px;border-bottom:1px solid var(--stroke-soft);margin-bottom:18px;overflow-x:auto}
.rtab{
  padding:9px 4px;margin-right:18px;font-size:12.5px;font-weight:500;color:var(--text-disabled);
  border-bottom:2px solid transparent;cursor:not-allowed;background:none;border-top:0;border-left:0;border-right:0;white-space:nowrap;
}
.rtab.active{color:var(--primary);border-bottom-color:var(--primary);cursor:default}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-12);padding:13px 14px}
.kpi .lbl{font-size:11px;color:var(--text-soft);font-weight:500;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.kpi .val{font-size:21px;font-weight:600;letter-spacing:-.01em}
.kpi .delta{font-size:11.5px;color:var(--success);margin-top:3px;font-weight:500}
.kpi .delta.flat{color:var(--text-soft)}

.kpistrip{display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-16);box-shadow:var(--shadow-xs);margin-bottom:16px;overflow:hidden}
.kpistrip-cell{padding:16px 10px;text-align:center;border-left:1px solid var(--stroke-soft)}
.kpistrip-cell:first-child{border-left:0}
.kpistrip-cell .lbl{font-size:11.5px;color:var(--text-soft);margin-bottom:7px}
.kpistrip-cell .val{font-size:20px;font-weight:600;letter-spacing:-.01em}
.kpistrip-cell .note{font-size:10.5px;color:var(--error-dark);font-weight:600;margin-top:3px}

/* Прототип v2: саб-табы «Журнал / Сводная статистика» - подчёркивание снизу,
   тот же идиом, что у верхних вкладок .pt-modetab, а не рамка-кнопка */
.stats-subtabs{display:flex;align-items:center;gap:22px;margin:2px 0 18px;border-bottom:1px solid var(--stroke-soft)}
.stats-subtab{padding:0 0 10px;font-size:13.5px;font-weight:500;color:var(--text-soft);cursor:pointer;
  border:0;border-bottom:2px solid transparent;background:none;margin-bottom:-1px}
.stats-subtab .cnt{color:inherit;font-weight:500;margin-left:2px}
.stats-subtab:hover:not(.active){color:var(--text-strong)}
.stats-subtab.active{color:var(--text-strong);border-bottom-color:var(--primary)}
.stats-note{font-size:12.5px;color:var(--text-soft);margin:0 0 4px}

/* Сводная статистика: KPI-карточки в ряд */
.statskpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:16px 0}
.statskpi{background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-12);padding:18px 14px;text-align:center}
.statskpi .lbl{font-size:11.5px;color:var(--text-soft);margin-bottom:8px}
.statskpi .val{font-size:26px;font-weight:600;letter-spacing:-.01em}
.statskpi .val.err{color:var(--error-dark)}
.statskpi .note{font-size:11px;color:var(--text-soft);margin-top:4px}
.statskpi .note.err{color:var(--error-dark);font-weight:600}
@media (max-width:900px){.statskpi-row{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Сводная статистика: панели распределения */
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.stats-grid{grid-template-columns:1fr}}
.dist-panel-h{display:flex;align-items:center;justify-content:space-between}
.dist-row{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-bottom:1px solid var(--stroke-soft)}
.dist-row:last-child{border-bottom:0}
.dist-row:hover{background:var(--bg-weak);margin:0 -8px;padding:8px 8px;border-radius:var(--radius-8)}
.dist-row:hover .dist-label{color:var(--primary)}
.dist-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.dist-label{width:140px;flex:0 0 140px;font-size:12.5px;color:var(--text-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dist-bar-wrap{flex:1;height:7px;background:var(--bg-weak);border-radius:4px;overflow:hidden;min-width:40px}
.dist-bar{display:block;height:100%;border-radius:4px}
.dist-count{flex:0 0 76px;text-align:right;font-size:12px;color:var(--text-soft);white-space:nowrap}
@media (max-width:520px){.dist-label{width:100px;flex-basis:100px}}

/* Внешние клиенты — header card actions, export/date popovers */
.ext-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0}
.popwrap{position:relative}
/* #dateRangeBtn текст не должен переноситься - выбранный период это длинная строка
   ("30.07.2026 — 28.08.2026"), перенос на 2 строки меняет высоту кнопки и
   сдвигает попап вниз (top:calc(100% + 6px) считается от нижнего края кнопки) */
#dateRangeBtn{white-space:nowrap}
.dropmenu{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-10);box-shadow:var(--shadow-pop);min-width:180px;padding:5px;z-index:30}
.dropmenu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;background:none;border-radius:var(--radius-8);font-size:12.5px;font-weight:500;color:var(--text-strong);cursor:pointer;text-align:left}
.dropmenu button:hover{background:var(--bg-weak)}

.datepop{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-16);box-shadow:var(--shadow-pop);z-index:30;display:flex;overflow:hidden;width:560px}
.datepop-quick{width:130px;flex:0 0 130px;border-right:1px solid var(--stroke-soft);padding:10px;display:flex;flex-direction:column;gap:1px}
.datepop-quick button{border:0;background:none;text-align:left;padding:8px 9px;border-radius:var(--radius-8);font-size:12.5px;color:var(--text-sub);cursor:pointer}
.datepop-quick button:hover{background:var(--bg-weak);color:var(--text-strong)}
.datepop-main{flex:1;padding:14px 16px 0;display:flex;flex-direction:column}
.datepop-months{display:flex;gap:18px}
.cal{flex:1}
.cal-head{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:8px}
.cal-nav{width:22px;height:22px;border-radius:var(--radius-6);border:0;background:none;color:var(--text-sub);cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-nav:hover{background:var(--bg-weak)}
.cal-nav.ph{visibility:hidden}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.cal-dow{font-size:10px;color:var(--text-soft);font-weight:600;padding:4px 0}
.cal-day{font-size:12px;padding:6px 0;border-radius:var(--radius-6);cursor:pointer;color:var(--text-strong)}
.cal-day:hover{background:var(--bg-weak)}
.cal-day.out{color:var(--text-disabled);cursor:default}
.cal-day.out:hover{background:none}
.cal-day.in-range{background:var(--primary-a10);border-radius:0}
.cal-day.range-start{background:var(--primary);color:#fff;border-radius:var(--radius-6) 0 0 var(--radius-6)}
.cal-day.range-end{background:var(--primary);color:#fff;border-radius:0 var(--radius-6) var(--radius-6) 0}
.cal-day.range-only{background:var(--primary);color:#fff;border-radius:var(--radius-6)}
.datepop-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--stroke-soft);padding:11px 16px;margin-top:12px;font-size:12px;color:var(--text-sub)}

.tbl-toprow{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--stroke-soft)}
.tbl-toprow .cnt{font-size:12.5px;color:var(--text-sub);font-weight:500}

/* partner-creation wizard stepper */
.wiz-stepper{display:flex;align-items:flex-start;margin-bottom:18px}
.wiz-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto}
.wiz-num{width:26px;height:26px;flex:0 0 26px;border-radius:99px;border:1.5px solid var(--stroke-med);color:var(--text-soft);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;background:var(--bg-white)}
.wiz-label{font-size:11px;color:var(--text-soft);white-space:nowrap;text-align:center}
.wiz-line{flex:1 1 auto;height:1.5px;background:var(--stroke-soft);margin:12px 6px 0}
.wiz-step.active .wiz-num{border-color:var(--primary);color:var(--primary);background:var(--info-bg)}
.wiz-step.active .wiz-label{color:var(--text-strong);font-weight:600}
.wiz-step.done .wiz-num{border-color:var(--primary);background:var(--primary);color:#fff}
.wiz-step.done .wiz-label{color:var(--text-sub)}

/* error-export period cards */
.errexport-list{display:flex;flex-direction:column}
.errexport-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--stroke-soft);flex-wrap:wrap}
.errexport-item:last-child{border-bottom:0;padding-bottom:0}
.errexport-item:first-child{padding-top:0}
.errexport-label{font-size:12.5px;color:var(--text-strong);flex:1;min-width:0}
.daterange-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 10px;border:1px solid var(--stroke-med);border-radius:var(--radius-8);background:var(--bg-white);font-size:11.5px;color:var(--text-sub);white-space:nowrap;flex:0 0 auto}
.daterange-chip svg{color:var(--text-soft);flex:0 0 auto}
.daterange-chip .chip-x{border:none;background:transparent;cursor:pointer;color:var(--text-soft);font-size:10px;line-height:1;padding:5px;border-radius:var(--radius-6);display:inline-flex}
.daterange-chip .chip-x:hover{background:var(--bg-weak);color:var(--text-sub)}

/* filter pill-button + dropdown (matches bb2 "Статус: Все ▾" component) */
.fbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border:1px solid var(--stroke-med);border-radius:var(--radius-10);background:var(--bg-white);box-shadow:var(--shadow-xs);cursor:pointer;font-size:12.5px;white-space:nowrap}
.fbtn:hover{border-color:#d4d4d4}
.fbtn .flabel{color:var(--text-soft)}
.fbtn .fval{color:var(--text-strong);font-weight:500}
.fbtn .fchev{color:var(--text-soft);flex:0 0 8px}
.fmenu{position:absolute;top:calc(100% + 6px);left:0;background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-10);box-shadow:var(--shadow-pop);min-width:190px;max-height:280px;overflow-y:auto;padding:5px;z-index:30}
.fmenu button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:7px 9px;border:0;background:none;border-radius:var(--radius-8);font-size:12.5px;color:var(--text-strong);cursor:pointer;text-align:left}
.fmenu button:hover{background:var(--bg-weak)}
.fmenu button.sel{color:var(--primary);font-weight:600}

.panel{background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-12);box-shadow:var(--shadow-xs)}
.panel + .panel{margin-top:14px}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--stroke-soft)}
.panel-h h3{font-size:13.5px;font-weight:600;margin:0}
.panel-h .hint{font-size:11.5px;color:var(--text-soft);margin-top:1px}
.panel-b{padding:16px}
.panel-h.collapsible{cursor:pointer;user-select:none}
.panel-chev{background:none;border:0;padding:4px;margin:0;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--text-soft);cursor:pointer;border-radius:var(--radius-8);transition:transform .15s}
.panel-chev:hover{color:var(--text-strong);background:var(--bg-weak)}
.panel-chev.open{transform:rotate(180deg)}
.panel-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:12px 16px 12px}
.panel[data-collapsed="true"] > .panel-h{border-bottom:0}
.panel[data-collapsed="true"] > .panel-b,
.panel[data-collapsed="true"] > .twrap,
.panel[data-collapsed="true"] > .panel-actions,
.panel[data-collapsed="true"] > .pagfoot,
.panel[data-collapsed="true"] > .empty-state{display:none}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.search{
  display:flex;align-items:center;gap:7px;border:1px solid var(--stroke-med);border-radius:var(--radius-10);
  background:var(--bg-white);padding:7px 11px;min-width:230px;box-shadow:var(--shadow-xs);flex:1;max-width:340px;
}
.search svg{color:var(--text-soft);flex:0 0 14px}
.search input{border:0;outline:0;background:none;width:100%;font-size:12.5px}
.select{
  border:1px solid var(--stroke-med);border-radius:var(--radius-10);background:var(--bg-white);
  padding:7px 28px 7px 11px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow-xs);cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6'><path d='M1 1l3.5 3.5L8 1' stroke='%235c5c5c' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;
}
.chipbtns{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{
  border:1px solid var(--stroke-med);background:var(--bg-white);border-radius:var(--radius-full);
  padding:6px 12px;font-size:12px;font-weight:500;color:var(--text-sub);cursor:pointer;white-space:nowrap;
}
.chipbtn:hover{background:var(--bg-weak)}
.chipbtn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.clearbtn{font-size:12px;color:var(--text-soft);text-decoration:underline;cursor:pointer;background:none;border:0;padding:6px 4px}
.clearbtn:hover{color:var(--text-strong)}
.checkfilter{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sub);cursor:pointer;padding:0 4px}

.twrap{overflow-x:auto;border-radius:var(--radius-12)}
table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
table.grid thead th{
  text-align:left;font-size:10.5px;font-weight:600;color:var(--text-soft);text-transform:uppercase;letter-spacing:.03em;
  padding:9px 14px;border-bottom:1px solid var(--stroke-soft);white-space:nowrap;background:var(--bg-white);
}
table.grid tbody td{padding:11px 14px;border-bottom:1px solid var(--stroke-soft);vertical-align:middle;white-space:nowrap}
table.grid tbody tr{cursor:pointer;transition:background .1s}
table.grid tbody tr:hover{background:var(--bg-weak)}
table.grid tbody tr:last-child td{border-bottom:0}
.cell-strong{font-weight:500;color:var(--text-strong)}
.cell-sub{font-size:11.5px;color:var(--text-soft);margin-top:1px}
.mono{font-family:var(--font-mono);font-size:11.5px;color:var(--text-sub)}
.empty-state{padding:50px 20px;text-align:center;color:var(--text-soft)}
.empty-state .big{font-size:13px;font-weight:500;color:var(--text-sub);margin-bottom:4px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--radius-full);font-size:11px;font-weight:600;white-space:nowrap}
.badge .d{width:6px;height:6px;border-radius:99px}
.b-success{background:var(--success-bg);color:var(--success-dark)}
.b-success .d{background:var(--success)}
.b-warning{background:var(--warning-bg);color:var(--warning-dark)}
.b-warning .d{background:var(--warning)}
.b-error{background:var(--error-bg);color:var(--error-dark)}
.b-error .d{background:var(--error)}
.b-info{background:var(--info-bg);color:var(--primary)}
.b-info .d{background:var(--primary)}
.b-faded{background:var(--faded-bg);color:var(--faded)}
.b-faded .d{background:var(--faded)}
.tag{display:inline-flex;padding:2.5px 8px;border-radius:var(--radius-6);font-size:11px;font-weight:500;background:var(--bg-soft);color:var(--text-sub)}

.backlink{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-sub);cursor:pointer;margin-bottom:12px;font-weight:500}
.backlink:hover{color:var(--primary)}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.detail-title{display:flex;align-items:center;gap:12px}
.avatar-lg{width:44px;height:44px;border-radius:var(--radius-full);background:linear-gradient(135deg,var(--purple-700),var(--purple-400));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex:0 0 44px}
.detail-title h1{margin:0;font-size:18px;font-weight:600}
.metarow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.detail-title .metarow{margin-top:5px}
.idline{font-size:11.5px;color:var(--text-soft)}
.detail-title .idline{margin-top:4px;display:block}

/* Аккаунт — общая шапка карточки (одна и та же для физлиц и партнёров) */
.rec-card{background:transparent;padding:0;margin-bottom:16px}
.rec-top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.rec-back{width:44px;height:44px;border-radius:var(--radius-10);border:1px solid var(--stroke-soft);background:var(--bg-white);display:flex;align-items:center;justify-content:center;color:var(--primary);cursor:pointer;flex:0 0 44px;text-decoration:none}
.rec-back:hover{background:var(--bg-weak)}
.rec-headrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rec-headrow h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.005em}
.rec-pill{display:inline-flex;padding:3px 11px;border-radius:var(--radius-full);font-size:11.5px;font-weight:600}
.btn-solid-danger{background:var(--error);border-color:var(--error);color:#fff}
.btn-solid-danger:hover{background:#e0212f;border-color:#e0212f}
.rec-meta{display:flex;align-items:center;gap:16px;margin-top:8px;font-size:12px;color:var(--text-soft);flex-wrap:wrap}
/* .idcopy - не только в шапке карточки, теперь и в ячейках таблицы (колонка "Объект") */
.idcopy{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-family:var(--font-mono)}
.idcopy:hover{color:var(--text-sub)}
.idcopy svg{opacity:.6;flex:0 0 12px}
.idcopy-sm{font-size:11.5px}
.idcopy-sm svg{flex:0 0 10px}
.rec-date{font-size:12.5px;color:var(--text-soft);margin:6px 0 0}

.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1050px){.grid2{grid-template-columns:1fr}}

.deflist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 20px;min-width:0}
.deflist.cols1{grid-template-columns:1fr}
.deflist.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.deflist.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}
.deflist dd{overflow-wrap:anywhere}
@media (max-width:1180px){.deflist.cols4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kyc-preview-wrap{position:relative;max-height:560px;overflow:hidden}
.kyc-preview-wrap::after{content:'';position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(to bottom, transparent, var(--bg-app) 78%);pointer-events:none}
.deflist dt{font-size:11px;color:var(--text-soft);font-weight:500;text-transform:uppercase;letter-spacing:.02em;margin-bottom:3px}
.deflist dd{margin:0;font-size:13px;font-weight:500;color:var(--text-strong)}

/* карта полей (вкладка «Описание»): экран -> путь в контракте. Бейдж под
   подписью поля - не переводится в uppercase/letter-spacing родителя dt/th,
   поэтому явно сбрасывает оба свойства */
.gqlpath{display:block;max-width:fit-content;margin-top:4px;font-family:var(--font-mono);font-size:9.5px;font-weight:600;
  text-transform:none;letter-spacing:0;color:var(--primary);background:var(--primary-a10);border-radius:4px;padding:2px 6px;white-space:normal}
table.grid thead th.fm-th{white-space:normal;vertical-align:top}
.fieldmap-example{margin-top:14px}
.fieldmap-example .panel + .panel{margin-top:14px}
.deflist dd.muted{color:var(--text-soft);font-weight:400}
.main-desc{margin-top:16px;padding-top:14px;border-top:1px solid var(--stroke-soft)}
.main-desc dt{font-size:11px;color:var(--text-soft);font-weight:500;text-transform:uppercase;letter-spacing:.02em;margin-bottom:5px}
.main-desc dd{margin:0;font-size:13.5px;line-height:1.55;color:var(--text-sub);overflow-wrap:anywhere}
.muted{color:var(--text-soft)}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--stroke-soft)}
.toggle-row:last-child{border-bottom:0}
.toggle-row .tt{font-size:13px;font-weight:500}
.ts{font-size:11.5px;color:var(--text-soft)}
.toggle-row .ts{margin-top:2px}
.switch{position:relative;width:36px;height:21px;flex:0 0 36px;border-radius:99px;background:var(--stroke-med);cursor:pointer;transition:background .15s;border:0;padding:0}
.switch.on{background:var(--primary)}
.switch .knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:99px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch.on .knob{left:17px}
.switch[disabled]{opacity:.5;cursor:not-allowed}
.pin{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--text-soft);background:var(--bg-soft);padding:2px 6px;border-radius:99px}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:500;color:var(--text-sub)}
.field input,.field select,.field textarea{
  border:1px solid var(--stroke-med);border-radius:var(--radius-8);padding:8px 10px;font-size:12.5px;
  background:var(--bg-white);width:100%;outline:0;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-a10)}
.field .req{color:var(--error)}
.field small{font-size:11px;color:var(--text-soft)}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field-grid.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.hairline{border:0;border-top:1px solid var(--stroke-soft);margin:16px 0}

.secretbox{display:flex;align-items:center;gap:8px;background:var(--bg-weak);border:1px solid var(--stroke-soft);border-radius:var(--radius-8);padding:9px 11px}
.secretbox .val{flex:1;font-family:var(--font-mono);font-size:12px;color:var(--text-sub);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.actionsbar{display:flex;gap:8px;flex-wrap:wrap}

.doclist{display:flex;flex-direction:column;gap:1px}
.docrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--stroke-soft)}
.docrow:last-child{border-bottom:0}
.doc-thumb{width:34px;height:34px;flex:0 0 34px;border-radius:var(--radius-8);background:var(--bg-weak);border:1px solid var(--stroke-soft);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer}
.doc-thumb:hover{background:var(--bg-soft)}
.doc-name{flex:1;font-size:12.5px;font-weight:500;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-name:hover{color:var(--primary)}
.icon-btn{width:30px;height:30px;flex:0 0 30px;border-radius:var(--radius-8);border:1px solid var(--stroke-med);background:var(--bg-white);color:var(--text-sub);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:var(--bg-weak);color:var(--text-strong)}
.icon-btn.danger:hover{background:var(--error-bg);color:var(--error-dark);border-color:#ffd0d4}
.doc-preview-box{width:100%;aspect-ratio:3/4;background:var(--bg-weak);border:1px solid var(--stroke-soft);border-radius:var(--radius-12);display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--text-soft)}

.checklist{display:flex;flex-direction:column}
.checkrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--stroke-soft)}
.checkrow:last-child{border-bottom:0}
.checkrow .nm{font-size:12.5px;font-weight:500;flex:1;min-width:0}
.checkrow .nm .sub{font-size:11px;font-weight:400;color:var(--text-soft);margin-top:1px}

.logrow{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:10px 4px;border-bottom:1px solid var(--stroke-soft);font-size:12px}
.logrow:last-child{border-bottom:0}
.logrow .when{color:var(--text-soft);font-size:11px}
.logrow .field-name{font-weight:500}
.logrow .diff{color:var(--text-sub);margin-top:2px}
.logrow .diff .old{color:var(--error-dark);text-decoration:line-through;opacity:.7}
.logrow .diff .new{color:var(--success-dark);font-weight:500}
.logrow .reason{color:var(--text-soft);font-size:11.5px;margin-top:2px;font-style:italic}
.logrow .actor{font-size:11px;color:var(--text-soft);margin-top:3px}

.delnote{background:var(--warning-bg);border:1px solid #ffe0c2;border-radius:var(--radius-10);padding:11px 13px;font-size:12.5px;color:var(--warning-dark);margin-bottom:12px}

.placeholder-card{padding:60px 20px;text-align:center;color:var(--text-soft);border:1px dashed var(--stroke-med);border-radius:var(--radius-12);background:var(--bg-white)}
.placeholder-card b{color:var(--text-sub);display:block;margin-bottom:4px;font-size:13px}

.overlay{position:fixed;inset:0;background:rgba(23,23,23,.42);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--bg-white);border-radius:var(--radius-16);box-shadow:var(--shadow-pop);width:100%;max-width:480px;overflow:hidden}
.modal.wide{max-width:640px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--stroke-soft)}
.modal-h h3{margin:0;font-size:14.5px;font-weight:600}
.modal-x{width:26px;height:26px;border-radius:var(--radius-8);border:0;background:none;color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--bg-weak);color:var(--text-strong)}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:13px;max-height:64vh;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--stroke-soft)}
.section-num{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text-soft);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 0}
.section-num .n{width:18px;height:18px;border-radius:99px;background:var(--primary-a14);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:10.5px}

.jsonbox{background:#171717;color:#d9d9e3;border-radius:var(--radius-10);padding:12px 13px;font-family:var(--font-mono);font-size:11.5px;line-height:1.6;overflow-x:auto;white-space:pre}

/* ---- op-parties: карточки отправителя/получателя ---- */
.parties{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:0;align-items:stretch}
@media (max-width:820px){.parties{grid-template-columns:1fr}}
.party{background:var(--bg-weak);border:1px solid var(--stroke-soft);border-radius:var(--radius-12);padding:16px;display:flex;flex-direction:column;gap:12px}
.party-hd{display:flex;align-items:center;gap:11px}
.party-avatar{width:36px;height:36px;border-radius:var(--radius-10);background:var(--primary-a10);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
.party-hd .role{font-size:10.5px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.03em}
.party-hd .name{font-size:14.5px;font-weight:600;color:var(--text-strong)}
.party-hd .name.linkable{color:var(--primary);cursor:pointer;text-decoration:none}
.party-hd .name.linkable:hover{text-decoration:underline}
.party-badges{display:flex;gap:6px;flex-wrap:wrap}
.party-rows{display:flex;flex-direction:column;gap:9px}
.party-row .k{font-size:10.5px;color:var(--text-soft)}
.party-row .v{font-size:13px;font-weight:500;color:var(--text-strong);word-break:break-word;display:block;text-decoration:none}
.party-row .v.dim{color:var(--text-soft);font-weight:400;font-style:italic}
.party-row a.v.linkable{color:var(--primary);font-weight:700;cursor:pointer}
.party-row a.v.linkable:hover{text-decoration:underline}
.party-link{margin-top:auto;padding-top:10px;border-top:1px dashed var(--stroke-med);font-size:12.5px;font-weight:600;color:var(--primary);cursor:pointer;display:flex;align-items:center;gap:6px}
.party-link.disabled{color:var(--text-soft);cursor:not-allowed}
.mid-divider{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-soft)}
.mid-divider .line{width:1px;flex:1;background:var(--stroke-soft)}
.mid-divider .arrow-ic{width:26px;height:26px;border-radius:50%;background:var(--bg-white);border:1px solid var(--stroke-soft);display:flex;align-items:center;justify-content:center;margin:8px 0;flex:0 0 auto}

/* ---- op-fee: комиссии ---- */
.fee-box{margin-top:16px;padding-top:16px;border-top:1px solid var(--stroke-soft)}
.fee-box .fee-cols{display:grid;grid-template-columns:repeat(2,1fr);gap:0 40px}
@media (max-width:820px){.fee-box .fee-cols{grid-template-columns:1fr}}
.fee-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px dashed var(--stroke-soft)}
.fee-row:first-child{border-top:none}
.fee-row .flabel{color:var(--text-soft)}
.fee-row .fval{font-weight:600;color:var(--text-strong)}
.fee-row.total{border-top:1px solid var(--stroke-soft);margin-top:2px;padding-top:8px}

/* ---- op-timeline: история и расчёт ---- */
.op-timeline{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding-bottom:4px}
.tl-step{display:flex;flex-direction:column;align-items:center;min-width:140px;position:relative}
.tl-step .dot{width:13px;height:13px;border-radius:50%;border:3px solid var(--stroke-soft);background:var(--bg-white);z-index:1}
.tl-step.done .dot{border-color:var(--success);background:var(--success)}
.tl-step.current .dot{border-color:var(--primary);background:var(--primary)}

<style>

/* витрина карточки клиентского аккаунта: демонстрирует, что переход есть, дальше — вне рамок прототипа */

/* переключатель «Описание / Прототип» — над хедером, на уровне всей страницы.
   Намеренно НЕ sticky: три независимых «липких» слоя (эта полоса + сайдбар +
   топбар админки, у каждого свой top) при одновременной горизонтальной
   прокрутке таблицы и вертикальной прокрутке страницы конфликтуют и оставляют
   пустой разрыв между полосой и содержимым. Полоса едет с документом обычным
   образом, сайдбар/топбар прилипают сами - ровно как в исходном партнёрском
   прототипе (там их top не трогали), без изменений здесь. */
.pt-toptabs{height:44px;display:flex;align-items:center;gap:2px;
  padding:0 16px;background:var(--bg-white);border-bottom:1px solid var(--stroke-soft)}
.pt-toptabs .pt-modetab{height:100%;display:flex;align-items:center;padding:0 14px;font-size:13px;
  font-weight:500;color:var(--text-sub);cursor:pointer;border:0;background:transparent;
  border-bottom:2px solid transparent;transition:color .12s,border-color .12s}
.pt-toptabs .pt-modetab:hover:not(.active){color:var(--text-strong)}
.pt-toptabs .pt-modetab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* вкладка «Описание» - отдельная страница без сайдбара/хедера админки */
.pt-descpage{min-height:100vh;background:var(--bg-app)}
.pt-descwrap{max-width:900px;margin:0 auto;padding:32px 24px 60px}

/* раскрывающийся блок контрактов — нативный <details>, поверх готовых .panel/.panel-chev */
details.panel > summary{list-style:none;cursor:pointer}
details.panel > summary::-webkit-details-marker{display:none}
details[open] .panel-chev{transform:rotate(180deg)}

/* карточка события: две колонки - основной поток секций слева, справа узкая
   sticky-панель со связанными по correlationId записями (у части событий пусто) */
.rec-detail-grid{display:flex;gap:16px;align-items:flex-start}
.rec-detail-main{flex:1;min-width:0}
.rec-detail-side{width:300px;flex:0 0 300px;position:sticky;top:72px}
.sib-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--stroke-soft);cursor:pointer}
.sib-row:last-child{border-bottom:0}
.sib-row:hover{background:var(--bg-weak);margin:0 -8px;padding:10px 8px;border-radius:var(--radius-8)}
@media (max-width:1100px){ .rec-detail-grid{flex-direction:column} .rec-detail-side{width:100%;flex:1 1 auto;position:static} }

.doc-contract + .doc-contract{margin-top:18px}
.doc-contract h5{font-size:12.5px;font-weight:600;margin:0 0 4px;color:var(--text-strong)}
.doc-contract .hint{font-size:11.5px;color:var(--text-soft);margin:0 0 8px}

/* таблицы мэппинга: каждая - своя вложенная раскрывашка внутри карточки пункта 3 */
.doc-subdetails{margin:0 0 10px;border:1px solid var(--stroke-soft);border-radius:var(--radius-8);overflow:hidden}
.doc-subdetails:last-child{margin-bottom:0}
.doc-subdetails > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px 12px;font-size:12.5px;font-weight:600;color:var(--text-strong)}
.doc-subdetails > summary::-webkit-details-marker{display:none}
.doc-subdetails > summary .doc-subhint{font-size:11px;font-weight:400;color:var(--text-soft);margin-left:8px}
.doc-subdetails[open] > summary{border-bottom:1px solid var(--stroke-soft)}
.doc-subdetails .doc-subchev{flex:0 0 auto;color:var(--text-soft);transition:transform .15s}
.doc-subdetails[open] .doc-subchev{transform:rotate(180deg)}
table.grid.doc-map td{white-space:normal}
table.grid.doc-map td.doc-map-desc{color:var(--text-soft);font-size:11.5px}
table.grid.doc-map tbody tr{cursor:default}
table.grid.doc-map tbody tr:hover{background:transparent}

/* текстовое описание доработок */
.doc-prose{font-size:13.5px;line-height:1.7;color:var(--text-strong)}

.doc-prose ul:last-child{margin-bottom:0}

.doc-section-lbl:first-child{margin-top:0}
/* карточка ТЗ-пункта: свёрнута - видна только исходная формулировка, развёрнута - разбор */
.doc-tz-card > summary{align-items:flex-start !important;gap:12px}
.doc-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;flex:0 0 auto;
  border-radius:999px;background:var(--primary-a10);color:var(--primary);font-size:11px;font-weight:700;margin-top:1px}
.doc-tz-text{flex:1;font-size:13px;font-weight:500;line-height:1.55;color:var(--text-strong)}

.doc-item ul{margin:0 0 10px;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.doc-item ul:last-child{margin-bottom:0}
.doc-item li{font-size:13px;line-height:1.55;color:var(--text-sub)}
</style>
</head>

const FAILURE_REASONS = [
  'Invalid credentials', 'Value "A" does not exist in enum', 'Insufficient permissions',
  'Cannot find title for error with code: VALIDATION-111', 'Request timed out',
];

/** affectedEntity в контракте - это только { type, id, ownerId }, имени там
 *  нет (реальная карточка bb2 в этом месте тоже показывает сырой id, не
 *  придуманное название). Раньше здесь были красивые "Тариф «Базовый»",
 *  "Кассовая операция ..." - без опоры на контракт, убрал. Для событий без
 *  конкретного объекта (вход, смена пароля и т.п.) id закономерно пуст. */
function targetFor(t, ev){
  switch(t.ent){
    case 'Session': case 'Credentials': case 'TwoFactor': case 'AuditLog':
      return {id:null};
    case 'PersonalProfile':
      return {id:ev.ownerId};
    default:
      return {id:ev.objId};
  }
}

function buildEvents(){
  const out = [];
  const base = new Date(2026,7,27,13,18,0);
  for(let i=0;i<78;i++){
    const t = EVENT_TYPES[Math.floor(rnd()*EVENT_TYPES.length)];
    // раньше разброс был всего 10 дней - пресеты "30 дней"/"90 дней" в фильтре
    // периода захватывали абсолютно все события целиком и визуально ничем не
    // отличались от "без фильтра". Расширил до 75 дней с перекосом к недавним
    // датам (rnd()*rnd() - реалистичнее: событий за последнюю неделю больше,
    // чем за два месяца назад), чтобы каждый пресет давал заметно разную выборку
    const when = new Date(base.getTime() - Math.floor(rnd()*rnd()*75*24*60*60*1000) - i*7*60*1000);

    let actorType, actor, source;
    if(t.async || t.code.startsWith('settings:sbp') || (t.ent==='UserOperationLock' && rnd()<0.6)){
      actorType = 'SYSTEM';
      const s = pick(SYSTEMS);
      actor = {name:'Система', email:'', id:s.name, sysLabel:s.label, role:''};
      source = 'BACKOFFICE';
    } else if(['VABS','TARIFFS','AML','CRYPTO','SETTINGS'].includes(t.cat) || rnd()<0.28){
      actorType = 'ADMIN';
      const a = pick(ADMINS);
      actor = {name:a.name, email:a.email, id:a.id, role:a.role};
      source = 'BACKOFFICE';
    } else {
      actorType = 'USER';
      const p = pick(PEOPLE);
      actor = {name:p.name, email:p.email, id:p.id, role:'Клиент'};
      source = pick(['WEB APP','WEB APP','MOBILE APP','TG_BOT']);
    }
    if(t.code==='auth:login_failed'){ actorType='USER'; actor={name:'', email:'', id:'anonymous', role:''}; }

    // self-service действие клиента над собой -> owner по умолчанию = сам актор
    // (audit-publisher.service.ts:_resolveAffectedOwnerId); ADMIN/SYSTEM владельца не наследуют;
    // анонимный актор (неудачный вход) владельца не знает вообще - не додумываем его
    const objId = uid();
    const ownerId = actorType==='USER' ? (actor.id==='anonymous' ? null : actor.id) : pick(PEOPLE).id;
    const status = t.fail ? 'FAILURE' : (rnd()<0.04 ? 'FAILURE' : 'SUCCESS');
    const evId = uid();
    const ev = {
      id: evId,
      publicId: 'LOG-'+evId.replace(/-/g,'').slice(0,8).toUpperCase(),
      when, type: t,
      actorType, actor,
      source,
      status,
      failureReason: status==='FAILURE' ? pick(FAILURE_REASONS) : '',
      severity: t.sev,
      ip: actorType==='SYSTEM' ? '' : pick(IPS),
      origin: actorType==='SYSTEM' ? '' : ORIGINS[source],
      ua: actorType==='SYSTEM' ? null : pick(UA_LIST),
      // context.deviceId реально смаплен в format-audit-log.helper.ts из auditLog.contextDeviceId -
      // поле в схеме есть, в одном из присланных примеров его просто не запрашивали
      deviceId: (actorType!=='SYSTEM' && rnd()<0.4) ? uid() : '',
      // сырой cf-ipcountry с шлюза - ISO-код, а не расшифрованное название:
      // бэкенд его не декодирует (см. audit-log geo: country ? {country} : undefined)
      geoCountry: (actorType!=='SYSTEM' && rnd()<0.2) ? pick(['RU','CY','AM','KZ']) : '',
      requestId: actorType==='SYSTEM' ? '' : uid(),
      sessionId: rnd()<0.5 ? uid() : '',
      objId, objShort: objId.slice(0,8),
      ownerId, ownerShort: ownerId ? ownerId.slice(0,8) : '',
      correlationId: uid(),
      auditTargetId: uid(),
    };
    ev.target = targetFor(t, ev);
    ev.changes = CHANGES_BY_CODE[t.code] || null;
    // если diff пришёл — событие почти наверняка опубликовал сервис-владелец (EVENT),
    // если нет — вероятнее шлюз по факту GraphQL-вызова (GRAPHQL); ровно так это
    // объяснено в audit-869edyg9d-worklog.md
    ev.targetType = ev.changes ? 'EVENT' : 'GRAPHQL';
    out.push(ev);
  }

  // пары по correlationId: одно действие часто даёт не одну запись, а две -
  // успех от сервиса-владельца (с диффом) + эхо от шлюза (без диффа), тот же
  // correlationId. Не у каждого события есть пара - это и есть "неполная" сводка.
  out.filter(ev=>ev.changes && rnd()<0.3).forEach(ev=>{
    const sibId = uid();
    out.push(Object.assign({}, ev, {
      id: sibId,
      publicId: 'LOG-'+sibId.replace(/-/g,'').slice(0,8).toUpperCase(),
      changes: null,
      targetType: 'GRAPHQL',
      requestId: uid(), sessionId: '',
      failureReason: '',
    }));
  });

  return out.sort((a,b)=>b.when-a.when);
}
const EVENTS = buildEvents();

function d0(y,m,d){ const x=new Date(y,m,d); x.setHours(0,0,0,0); return x; }
function sameDay(a,b){ return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function fmtRu(d){ return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear(); }
function two(n){ return ('0'+n).slice(-2); }
function fmtDateShort(d){ return two(d.getDate())+'.'+two(d.getMonth()+1)+'.'+d.getFullYear()+', '+two(d.getHours())+':'+two(d.getMinutes())+':'+two(d.getSeconds()); }
function fmtDateLong(d){ return two(d.getDate())+'.'+two(d.getMonth()+1)+'.'+d.getFullYear()+', '+two(d.getHours())+':'+two(d.getMinutes())+':'+two(d.getSeconds()); }
function relTime(d){
  const now = new Date(2026,7,27,13,18,0);
  const s = Math.round((now-d)/1000);
  if(s<60) return 'только что';
  if(s<3600){ const m=Math.round(s/60); return m+' '+plural(m,'минуту','минуты','минут')+' назад'; }
  if(s<86400){ const h=Math.round(s/3600); return h+' '+plural(h,'час','часа','часов')+' назад'; }
  const dd=Math.round(s/86400);
  if(dd===1) return 'вчера';
  return dd+' '+plural(dd,'день','дня','дней')+' назад';
}
function plural(n,a,b,c){ const n10=n%10, n100=n%100; if(n10===1&&n100!==11) return a; if(n10>=2&&n10<=4&&(n100<10||n100>=20)) return b; return c; }
function monthMatrix(y,m){
  const first = new Date(y,m,1); const start = (first.getDay()+6)%7;
  const out=[]; for(let i=0;i<42;i++){ out.push(new Date(y,m,1-start+i)); } return out;
}
function quickRanges(){
  const t=new Date(); t.setHours(0,0,0,0);
  const back=n=>{ const d=new Date(t); d.setDate(d.getDate()-n); return d; };
  return {'Сегодня':[t,t],'7 дней':[back(6),t],'30 дней':[back(29),t],'90 дней':[back(89),t]};
}
function toast(msg){
  const wrap=$('#toastWrap'); const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  wrap.appendChild(el); requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),200); },2600);
}
function isUuid(v){ return /^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(v||''); }
/** Единый формат сокращения ID везде: первые 3 и последние 3 символа -
 *  так видно и начало, и конец значения, а не только начало ("1234…" не даёт
 *  понять, отличаются ли два ID, если у них общий префикс). */
function shortId(id){ return (!id || id.length<=8) ? (id||'') : id.slice(0,3)+'…'+id.slice(-3); }
function sevBadge(s){ return '<span class="badge '+SEVERITY_CLASS[s]+'"><span class="d"></span>'+SEVERITY_LABEL[s]+'</span>'; }
function statusBadge(s){ return '<span class="badge '+STATUS_CLASS[s]+'"><span class="d"></span>'+STATUS_LABEL[s]+'</span>'; }

/** Актор в таблице: ФИО + email, со всеми фолбэками неполных данных. */
function actorCell(ev){
  const a = ev.actor;
  if(ev.actorType==='SYSTEM'){
    return '<div class="actor-line"><span class="actor-sys">Система</span><span class="tag">'+esc(a.sysLabel)+'</span></div>';
  }
  if(a.id==='anonymous'){
    return '<span class="muted">Не авторизован</span><div class="cell-sub">актор не определён</div>';
  }
  const chip = ev.actorType==='ADMIN' ? ' <span class="tag">админ</span>' : '';
  // клиент — ссылка ведёт на карточку аккаунта; администратор — такой карточки в прототипе нет
  const attr = ev.actorType==='ADMIN' ? 'data-noop' : 'data-acct-link="'+esc(a.id)+'"';
  // приоритет: имя -> email -> id. Что бы ни показали - без "имя не сохранено" под этим:
  // и так понятно, что показано именно то, что было доступно
  if(a.name) return '<a href="#" class="namelink" '+attr+'>'+esc(a.name)+'</a>'+chip+(a.email?'<div class="cell-sub">'+esc(a.email)+'</div>':'');
  if(a.email) return '<a href="#" class="namelink" '+attr+'>'+esc(a.email)+'</a>'+chip;
  return '<a href="#" class="idlink" '+attr+'>'+esc(shortId(a.id))+'</a>';
}
function actorPlain(ev){
  const a=ev.actor;
  if(ev.actorType==='SYSTEM') return 'Система '+a.sysLabel;
  if(a.id==='anonymous') return 'Не авторизован';
  return [a.name,a.email,a.id].filter(Boolean).join(' ');
}

function inRange(d){
  const f=state.filters;
  if(f.from && d < f.from) return false;
  if(f.to){ const e=new Date(f.to); e.setHours(23,59,59,999); if(d>e) return false; }
  return true;
}
function filtered(){
  const f = state.filters, q = f.q.trim().toLowerCase();
  return EVENTS.filter(ev=>{
    if(f.tab && ev.actorType!==f.tab) return false;
    if(f.cat && ev.type.cat!==f.cat) return false;
    if(f.ent && ev.type.ent!==f.ent) return false;
    if(f.act && ev.type.act!==f.act) return false;
    if(f.sev && ev.severity!==f.sev) return false;
    if(f.status && ev.status!==f.status) return false;
    if(f.src && ev.source!==f.src) return false;
    if(!inRange(ev.when)) return false;
    if(q){
      const hay = [ev.type.name, ev.type.code, ev.type.desc, CATEGORY_LABEL[ev.type.cat], ENTITY_LABEL[ev.type.ent],
                   ACTION_LABEL[ev.type.act], ev.target.id, actorPlain(ev), ev.ip, ev.origin, ev.correlationId, ev.id].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function sorted(list){
  const {key,dir} = state.sort, k = dir==='asc'?1:-1;
  const val = ev => ({
    when: ev.when.getTime(),
    cat: CATEGORY_LABEL[ev.type.cat],
    name: eventTitle(ev.type),
    target: ev.target.id||'',
    actor: actorPlain(ev),
    sev: ['INFO','WARNING','CRITICAL'].indexOf(ev.severity),
    status: ev.status,
    corr: ev.correlationId||'',
  })[key];
  return list.slice().sort((a,b)=>{ const x=val(a), y=val(b); return x<y?-k:(x>y?k:0); });
}

function renderDatePopover(){
  const view = state.dateUI.viewMonth || new Date();
  const y=view.getFullYear(), m=view.getMonth();
  const from=state.dateUI.tempFrom, to=state.dateUI.tempTo;
  function renderMonth(yy,mm,showPrev,showNext){
    const cells = monthMatrix(yy,mm).map(d=>{
      const out = d.getMonth()!==mm;
      let cls='cal-day'+(out?' out':'');
      if(!out && from && sameDay(d,from) && to && sameDay(d,to)) cls+=' range-only';
      else if(!out && from && sameDay(d,from) && to) cls+=' range-start';
      else if(!out && to && sameDay(d,to) && from) cls+=' range-end';
      else if(!out && from && sameDay(d,from) && !to) cls+=' range-only';
      else if(!out && from && to && d>from && d<to) cls+=' in-range';
      return '<div class="'+cls+'" '+(out?'':'data-day="'+d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()+'"')+'>'+d.getDate()+'</div>';
    }).join('');
    return '<div class="cal"><div class="cal-head">'
      + '<button class="cal-nav '+(showPrev?'':'ph')+'" data-calnav="prev">‹</button>'
      + '<span>'+MONTH_NAMES_RU[mm]+' '+yy+'</span>'
      + '<button class="cal-nav '+(showNext?'':'ph')+'" data-calnav="next">›</button>'
      + '</div><div class="cal-grid">'+DOW_RU.map(d=>'<div class="cal-dow">'+d+'</div>').join('')+cells+'</div></div>';
  }
  const nextM = m===11?0:m+1, nextY = m===11?y+1:y;
  const quickHtml = Object.keys(quickRanges()).map(k=>'<button data-quick="'+k+'">'+k+'</button>').join('');
  return '<div class="datepop"><div class="datepop-quick">'+quickHtml+'</div><div class="datepop-main">'
    + '<div class="datepop-months">'+renderMonth(y,m,true,false)+renderMonth(nextY,nextM,false,true)+'</div>'
    + '<div class="datepop-foot"><span>'+(from?fmtRu(from):'—')+' — '+(to?fmtRu(to):'—')+'</span>'
    + '<div style="display:flex;gap:8px"><button class="btn btn-sm" id="dateReset">Сбросить</button>'
    + '<button class="btn btn-primary btn-sm" id="dateApply">Применить</button></div></div></div></div>';
}

/** Раскрывающийся блок с полями реального контракта — по клику (нативный details).
 *  Ключ отвечает за то, что списковый и одиночный запрос показывают одни и те же
 *  данные, просто с разной степенью детализации. */
function contractBlock(){
  // event.* объекта нет - категория/сущность/действие/паттерн/критичность лежат
  // внутри target (eventCategory/eventEntity/eventAction/pattern/eventSeverity),
  // поправлено по реальному ответу API, а не по документации
  const listQuery = 'query auditLogs($input: FindAuditLogsInput!) {\n'
    + '  auditLogs(input: $input) {\n'
    + '    count\n    cursor\n    nodes {\n'
    + '      id\n      publicId\n      createdAt\n      correlationId\n      source\n'
    + '      actor { type id snapshot { name email role } }\n'
    + '      target { name description pattern eventAction eventSeverity\n'
    + '        eventCategory { name } eventEntity { name } }\n'
    + '      affectedEntity { type id ownerId }\n'
    + '      result { status failureReason }\n'
    + '      context { ipAddress origin }\n'
    + '    }\n  }\n}';
  const oneQuery = 'query auditLog($id: ID!) {\n'
    + '  auditLog(id: $id) {\n'
    + '    id\n    publicId\n    createdAt\n    updatedAt\n    correlationId\n    source\n    auditTargetId\n'
    + '    actor { type id snapshot { name email role } }\n'
    + '    target { id name description pattern type version isActive eventAction eventSeverity createdAt updatedAt\n'
    + '      eventCategory { id name description } eventEntity { id name description } }\n'
    + '    affectedEntity { type id ownerId }\n'
    + '    context { ipAddress userAgent origin deviceId sessionId requestId geo { country city } }\n'
    + '    result { status failureReason changes { changedFields oldValue newValue } }\n'
    + '    metadata { relatedEntities { type id name } riskAssessment { level score flags source } }\n'
    + '  }\n}';
  return '<details class="panel"><summary class="panel-h"><h3>Целевые контракты раздела</h3>'
    + '<span class="panel-chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none">'
    + '<path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
    + '</summary><div class="panel-b">'
    + '<div class="doc-contract"><h5>Список событий - query auditLogs</h5>'
    + '<p class="hint">Строит таблицу списка: колонки, фильтры, пагинация.</p>'
    + '<div class="jsonbox">'+esc(listQuery)+'</div></div>'
    + '<div class="doc-contract"><h5>Карточка события - query auditLog(id)</h5>'
    + '<p class="hint">Возвращает те же данные, что и список, плюс то, чего в списке нет: контекст целиком '
    + '(<code>userAgent</code>, <code>deviceId</code>, <code>geo</code> и т.п.), дифф изменений '
    + '(<code>result.changes</code>) и <code>metadata</code> (связанные сущности, оценка риска).</p>'
    + '<div class="jsonbox">'+esc(oneQuery)+'</div></div>'
    + '</div></details>';
}

function mapTable(title, count, hint, cols, rows){
  const thead = '<thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead>';
  const tbody = '<tbody>'+rows.map(r=>'<tr>'+r.map((v,i)=>'<td class="'+(i===0?'mono':(r.length===3&&i===2?'doc-map-desc':''))+'">'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody>';
  return '<details class="doc-subdetails"><summary>'
    + '<span>'+esc(title)+' ('+count+')<span class="doc-subhint">'+esc(hint)+'</span></span>'
    + '<span class="doc-subchev"><svg width="12" height="12" viewBox="0 0 24 24" fill="none">'
    + '<path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
    + '</summary><div class="twrap"><table class="grid doc-map">'+thead+tbody+'</table></div></details>';
}

function fmLbl(label, path){
  return esc(label) + (path ? '<span class="gqlpath">'+esc(path)+'</span>' : '');

/** Как dl(), но dt - сырой HTML (там уже готовый fmLbl()). */

    + '</dl>';
}

const DIST_PALETTE = ['var(--primary)','#1fc16b','#fa7319','#47bfff','#7d52f4','#e34a4a','#c77a12','#0b8a5f','#a35de8','#2e93c9'];
/** Группировка событий по значению keyFn - отсортировано по убыванию count.
 *  labelFn переводит ключ в подпись (например CATEGORY_LABEL). */
function distGroups(events, keyFn, labelFn){
  const map = new Map();
  events.forEach(ev=>{
    const k = keyFn(ev);
    if(k===undefined || k===null || k==='') return;
    map.set(k, (map.get(k)||0)+1);
  });
  const total = events.length || 1;
  return Array.from(map.entries())
    .map(([k,count])=>({ key:k, label:labelFn(k)||k, count, pct: Math.round(count/total*100) }))
    .sort((a,b)=>b.count-a.count);
}
/** Панель «Распределение по …»: цвет либо из colorMap (сериозность/статус -
 *  у них уже есть смысловой цвет в остальном прототипе), либо по кругу из
 *  DIST_PALETTE (категория/сущность - смыслового цвета у них нет).
 *  Клик по строке - переход в «Журнал» с применённым фильтром (filterKey). */
function distPanel(title, groups, filterKey, colorMap){
  const rows = groups.map((g,i)=>{
    const color = (colorMap && colorMap[g.key]) || DIST_PALETTE[i%DIST_PALETTE.length];
    return '<div class="dist-row" data-filter-key="'+filterKey+'" data-filter-val="'+esc(g.key)+'">'
      + '<span class="dist-dot" style="background:'+color+'"></span>'
      + '<span class="dist-label" title="'+esc(g.label)+'">'+esc(g.label)+'</span>'
      + '<span class="dist-bar-wrap"><span class="dist-bar" style="width:'+g.pct+'%;background:'+color+'"></span></span>'
      + '<span class="dist-count">'+g.count+' · '+g.pct+'%</span>'
      + '</div>';
  }).join('') || '<div class="empty-state" style="padding:16px 0"><div class="big">Нет данных</div>За выбранный период таких событий нет</div>';
  return '<div class="panel"><div class="panel-h dist-panel-h"><h3>'+esc(title)+'</h3>'
    + '<span class="hint">'+groups.length+' '+plural(groups.length,'значение','значения','значений')+'</span></div>'
    + '<div class="panel-b">'+rows+'</div></div>';
}
function renderStats(){
  const events = EVENTS.filter(ev=>inRange(ev.when));
  const total = events.length;
  const uniqueTypes = new Set(events.map(ev=>ev.type.code)).size;
  const failCount = events.filter(ev=>ev.status==='FAILURE').length;
  const failPct = total ? Math.round(failCount/total*100) : 0;
  // "AML-флаги" - честного отдельного признака у события нет (см. разбор
  // metadata.riskAssessment выше - для реальных KYT-событий оно приходит
  // пустым), поэтому здесь - количество событий категории AML, не более того
  const amlCount = events.filter(ev=>ev.type.cat==='AML').length;
  const periodLabel = (state.filters.from && state.filters.to) ? fmtRu(state.filters.from)+' — '+fmtRu(state.filters.to) : 'всё время';

  const sevColors = { INFO:'var(--primary)', WARNING:'var(--warning)', CRITICAL:'var(--error)' };
  const statusColors = { SUCCESS:'var(--success)', FAILURE:'var(--error)' };

  return ''
  + '<p class="stats-note">Агрегаты по всем событиям контура «Все» за период «'+esc(periodLabel)+'» '
  + '(без сквозного поиска и фильтров списка). Клик по бару — переход в журнал с применённым фильтром.</p>'

  + '<div class="statskpi-row">'
  +   '<div class="statskpi"><div class="lbl">Всего событий</div><div class="val">'+total+'</div><div class="note">в выборке контура</div></div>'
  +   '<div class="statskpi"><div class="lbl">Уникальных типов</div><div class="val">'+uniqueTypes+'</div><div class="note">разных кодов</div></div>'
  +   '<div class="statskpi"><div class="lbl">Доля ошибок</div><div class="val err">'+failPct+'%</div>'
  +     '<div class="note err">'+failCount+' '+plural(failCount,'событие-ошибка','события-ошибки','событий-ошибок')+'</div></div>'
  +   '<div class="statskpi"><div class="lbl">AML-флаги</div><div class="val">'+amlCount+'</div><div class="note">событий категории AML</div></div>'
  + '</div>'

  + '<div class="stats-grid">'
  +   distPanel('Распределение по категории', distGroups(events, ev=>ev.type.cat, k=>CATEGORY_LABEL[k]), 'cat')
  +   distPanel('Распределение по сущности', distGroups(events, ev=>ev.type.ent, k=>ENTITY_LABEL[k]), 'ent')
  +   distPanel('Распределение по критичности', distGroups(events, ev=>ev.severity, k=>SEVERITY_LABEL[k]), 'sev', sevColors)
  +   distPanel('Распределение по статусу', distGroups(events, ev=>ev.status, k=>STATUS_LABEL[k]), 'status', statusColors)
  + '</div>';
}

  const pages = Math.max(1, Math.ceil(total/state.pageSize));
  if(state.page>pages) state.page=pages;
  const start = (state.page-1)*state.pageSize;
  const list = all.slice(start, start+state.pageSize);

  const tabs = [['','Все'],['USER','Клиенты'],['ADMIN','Администраторы'],['SYSTEM','Система']]
    .map(([v,l])=>'<button class="seg-tab '+(state.filters.tab===v?'active':'')+'" data-tab="'+v+'">'+l+'</button>').join('');

  const rows = list.map(ev=>{
    return '<tr data-ev="'+ev.id+'">'
      + '<td><div class="cell-strong">'+fmtDateShort(ev.when)+'</div><div class="cell-sub">'+relTime(ev.when)+'</div></td>'
      + '<td>'+esc(CATEGORY_LABEL[ev.type.cat])+'</td>'
      // только действие - сущность и так следующей колонкой в "Объекте", дублировать её здесь незачем
      + '<td><div class="evt-name">'+esc(ACTION_LABEL[ev.type.act]||ev.type.act)+'</div></td>'
      + '<td><div class="cell-strong" style="font-size:12.5px">'+esc(ENTITY_LABEL[ev.type.ent]||ev.type.ent)+'</div>'
        + (ev.target.id
            ? '<div class="cell-sub mono idcopy idcopy-sm" data-copy="'+esc(ev.target.id)+'" title="Скопировать ID">'+esc(shortId(ev.target.id))
              + '<svg width="10" height="10" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="1.8"/></svg></div>'
            : '<div class="cell-sub muted">—</div>')+'</td>'
      + '<td>'+actorCell(ev)+'</td>'
      + '<td>'+sevBadge(ev.severity)+'</td>'
      + '<td>'+statusBadge(ev.status)+'</td>'
      // клик по Correlation ID подставляет значение в поиск - быстрый способ
      // найти другие записи по тому же действию, не открывая карточку
      + '<td><a href="#" class="idlink corr-link" data-corr="'+esc(ev.correlationId)+'">'+esc(shortId(ev.correlationId))+'</a></td>'
      + '</tr>';
  }).join('') || '<tr><td colspan="8"><div class="empty-state"><div class="big">По запросу ничего не найдено</div>Измените фильтры или поисковую фразу</div></td></tr>';

  const pagerBtns = (()=>{
    let html = '<button class="pgbtn" data-page="prev" '+(state.page===1?'disabled':'')+'>‹</button>';
    const win = [];
    for(let p=1;p<=pages;p++){ if(p===1||p===pages||Math.abs(p-state.page)<=1) win.push(p); else if(win[win.length-1]!=='…') win.push('…'); }
    win.forEach(p=>{ html += p==='…' ? '<span class="pgbtn" style="border:0;background:none;cursor:default">…</span>'
      : '<button class="pgbtn '+(p===state.page?'on':'')+'" data-page="'+p+'">'+p+'</button>'; });
    html += '<button class="pgbtn" data-page="next" '+(state.page===pages?'disabled':'')+'>›</button>';
    return html;
  })();

  return ''
  + (withHeader ? journalHeader() : '')

  + '<div class="toolbar" style="margin-bottom:8px"><div class="seg-tabs">'+tabs+'</div></div>'

  + '<div class="toolbar">'
  +   '<div class="search">'
  +     '<svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.4"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
  +     '<input id="evSearch" placeholder="Событие, актор, объект, IP, correlation ID…" value="'+esc(state.filters.q)+'">'
  +   '</div>'
  +   fpill('fCat','Категория',state.filters.cat,'cat',CAT_OPTS(),v=>CATEGORY_LABEL[v]||v)
  +   fpill('fEnt','Сущность',state.filters.ent,'ent',ENT_OPTS(),v=>ENTITY_LABEL[v]||v)
  +   fpill('fAct','Действие',state.filters.act,'act',ACT_OPTS(),v=>ACTION_LABEL[v]||v)
  +   fpill('fSev','Критичность',state.filters.sev,'sev',['INFO','WARNING','CRITICAL'],v=>SEVERITY_LABEL[v])
  +   fpill('fStatus','Статус',state.filters.status,'status',['SUCCESS','FAILURE'],v=>STATUS_LABEL[v])
  +   fpill('fSrc','Источник',state.filters.src,'src',['BACKOFFICE','WEB APP','MOBILE APP','TG_BOT'],v=>SOURCE_LABEL[v])
  +   '<a href="#" class="clearbtn" id="clearAll">Очистить все</a>'
  + '</div>'

  + '<div class="panel">'
  +   '<div class="twrap"><table class="grid"><thead><tr>'
  +     th('when','Время записи')
  +     th('cat','Категория')
  +     th('name','Событие')
  +     th('target','Объект')
  +     th('actor','Актор')
  +     th('sev','Критичность')
  +     th('status','Статус')
  +     th('corr','Correlation ID')
  +   '</tr></thead><tbody>'+rows+'</tbody></table></div>'
  +   '<div class="pagfoot"><span>Показано '+list.length+' из '+total+'</span>'
  +     '<div style="display:flex;align-items:center;gap:12px">'+pagerBtns
  +     '<select class="select" id="pageSize">'
  +       [10,20,50,100].map(n=>'<option value="'+n+'" '+(state.pageSize===n?'selected':'')+'>'+n+' / стр.</option>').join('')
  +     '</select></div></div>'
  + '</div>';
}

/* =========================================================================
   DETAIL — карточка события. Три профиля, состав секций зависит от данных.
   Тело карточки некликабельно и затемнено книзу.
   ========================================================================= */
function dl(cols, items){
  return '<dl class="deflist '+(cols?'cols'+cols:'')+'">'
    + items.map(it=>'<div><dt>'+esc(it[0])+'</dt><dd class="'+(it[2]||'')+'">'+(it[3]?it[1]:esc(it[1]))+'</dd></div>').join('')
    + '</dl>';
}
/** Как detailSection, но без подсказки-хинта и открыта по умолчанию - для
 *  панелей, которые не входят в дашборд заполненности (Основная информация,
 *  Результат), но всё равно должны сворачиваться, как и все остальные. */
function panel(title, body){
  return '<details class="panel" open><summary class="panel-h"><h3>'+esc(title)+'</h3>'
    + '<span class="panel-chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none">'
    + '<path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
    + '</summary><div class="panel-b">'+body+'</div></details>';
}

/* =========================================================================
   КАРТОЧКА КЛИЕНТСКОГО АККАУНТА — переход есть (клик по имени/email клиента
   в таблице и в карточке события), сама карточка вне рамок этого прототипа:
   взята из партнёрского прототипа 1:1, весь блок ниже шапки полностью
   некликабелен и заканчивается дымкой, дальше скроллить нечего.
   ========================================================================= */
const ACCOUNT_TABS = ['KYC','Тарифы','KYT','Счета','История операций','Журнал событий','Адреса кошельков','ОТС-сделки','Банковские депозиты','Ордера','Партнёрские'];
function acctHash(id){ let h=0; for(let i=0;i<id.length;i++){ h=(h*131 + id.charCodeAt(i))>>>0; } return h; }
function kycBadge(s){
  const map={PROCESSING:'b-info',SUCCESSFUL:'b-success',NONE:'b-faded'};
  return '<span class="badge '+map[s]+'" style="text-transform:uppercase;letter-spacing:.03em">'+s+'</span>';
}
/** Синтетическая карточка клиента по его id — детерминирована хешем id, не привязана к реальной модели. */
function accountFor(id){
  const p = PEOPLE.find(x=>x.id===id);
  const h = acctHash(id);
  const kycLevel = ['Level 1','Level 2','Level 3'][h%3];
  const kycStatus = ['PROCESSING','SUCCESSFUL','NONE'][Math.floor(h/3)%3];
  const day = 10+(h%18), hh = 9+(h%10), mm = (h*7)%60;
  return {
    id,
    name: (p&&p.name) ? p.name : '',
    email: (p&&p.email) ? p.email : '',
    phone: (h%3===0) ? ('+79'+String(100000000+(h%899999999)).slice(0,9)) : '',
    created: two(day)+'.08.26, '+two(hh)+':'+two(mm),
    kycLevel, kycStatus,
  };
}

  const tabsHtml = ACCOUNT_TABS.map((t,i)=>'<button class="seg-tab '+(i===0?'active':'locked')+'" '+(i===0?'':'title="Вне рамок текущего прототипа"')+'>'+t+'</button>').join('');

  const head = ''
  + '<div class="rec-card">'

  +     '</a>'
  +     '<div style="flex:1">'
  +       '<div class="rec-headrow" style="justify-content:space-between">'
  +         '<div class="rec-headrow" style="gap:12px"><h1>'+esc(title)+'</h1><span class="rec-pill b-success">Активен</span></div>'
  +       '</div>'
  +       '<div class="rec-meta">'
  +         '<span class="idcopy" data-copy="'+esc(id)+'" title="Скопировать ID">ID: '+esc(id)
  +           '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="1.6"/></svg>'
  +         '</span>'
  +         '<span>Дата: '+r.created+'</span>'
  +       '</div>'
  +     '</div>'
  +   '</div>'
  +   '<div class="seg-tabs" style="margin-top:16px">'+tabsHtml+'</div>'
  + '</div>';

  const body = ''
  + panel('Личная информация', dl(4,[
      ['Полное имя', r.name||'—', r.name?'':'muted'],
      ['Имя','—','muted'], ['Отчество','—','muted'], ['Фамилия','—','muted'],
      ['Пол','—','muted'], ['Дата рождения','—','muted'], ['Страна рождения','—','muted'], ['Страна проживания','—','muted'],
      ['ИНН','—','muted'], ['Национальность','—','muted'],
      ['Является партнёром', 'Нет <a href="#" class="namelink" style="margin-left:10px">Сделать партнёром →</a>', '', true],
      ['Наименование партнёра','—','muted'],
    ]))
  + panel('Контакты', dl(3,[
      ['Эл. почта', r.email||'—', r.email?'':'muted'],
      ['Телефон', r.phone||'—', r.phone?'':'muted'],
    ]))
  + panel('Верификация (KYC)', dl(4,[
      ['Уровень', r.kycLevel, ''],
      ['Статус', kycBadge(r.kycStatus), '', true],
    ]))
  + panel('Настройки СБП', dl(4,[
      ['Телефон СБП','—','muted'],
      ['Доступ к СБП', '<span class="badge b-faded"><span class="d"></span>Выключен</span>', '', true],
      ['Pay2Me', '<span class="badge b-faded"><span class="d"></span>Выключен</span>', '', true],
      ['ВТБ', '<span class="badge b-faded"><span class="d"></span>Выключен</span>', '', true],
    ]))
  + panel('Доступность операций', dl(4,[
      ['Операции заблокированы', '<button class="switch" disabled><span class="knob"></span></button>', '', true],
      ['Заблокировано до','—','muted'], ['Причина','—','muted'], ['Осталось времени','—','muted'],
    ]));

  return head + '<div class="acct-frozen">' + body + '</div>';
