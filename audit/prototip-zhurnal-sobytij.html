function openAccount(id){
  state.prevView = state.view;
  state.currentAccountId = id;
  state.view = 'account';
  render();
}
function bindAccountPage(){
  // намеренно: единственный рабочий элемент страницы — кнопка «назад».
  // Всё остальное (вкладки, «Сделать партнёром», копирование ID) не кликабельно —
  // страница лишь показывает, что переход в аккаунт существует.
  $('#backFromAccount')?.addEventListener('click', e=>{ e.preventDefault(); state.view = state.prevView || 'list'; render(); });
}

/** Секция карточки события - раскрывашка, а не условный рендер: на странице
 *  всегда все секции в одном порядке, различается только состояние по
 *  умолчанию (open/collapsed) и подсказка в шапке при сворачивании.
 *  openByDefault решает не тип события, а факт: есть ли в секции значимые
 *  данные - то же событие другого типа откроет другой набор секций само. */
function detailSection(title, hint, bodyHtml, openByDefault){
  return '<details class="panel"'+(openByDefault?' open':'')+'>'
    + '<summary class="panel-h"><h3>'+esc(title)+'</h3>'
    + '<div style="display:flex;align-items:center;gap:10px">'
    + (hint ? '<span class="hint">'+esc(hint)+'</span>' : '')
    + '<span class="panel-chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none">'
    + '<path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
    + '</div></summary><div class="panel-b">'+bodyHtml+'</div></details>';
}

function renderDetail(){
  const ev = EVENTS.find(e=>e.id===state.openId);
  if(!ev) return '<div class="empty-state">Событие не найдено</div>';
  const t = ev.type, a = ev.actor;

  /* ——— шапка: заголовок больше не берётся из выдуманного «красивого имени»
     на паттерн - таких имён нет в контракте (карточка bb2 показывает в шапке
     сырой UUID), а с ростом каталога до ~400+ паттернов вести имя на каждый
     нереально. Вместо этого заголовок собирается из тех же переводных
     словарей, что и «Основная информация»: Действие + Сущность - это
     закрытые справочники (15 действий / ~132 сущности), они масштабируются.
     Рядом с заголовком - теги критичности/статуса, без прижатия вправо.
     Ниже - строкой дата/время и рядом с ними, там же, короткий ID. ——— */
  const headTitle = eventTitle(t);
  const head = ''
  + '<div class="rec-card">'
  +   '<div class="rec-top">'
  +     '<a href="#" class="rec-back" id="backToList">'
  +       '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  +     '</a>'
  +     '<div style="flex:1">'
  +       '<div class="rec-headrow" style="gap:10px">'
  +         '<h1>'+esc(headTitle)+'</h1>'
  +         '<span class="rec-pill '+SEVERITY_CLASS[ev.severity]+'">'+SEVERITY_LABEL[ev.severity]+'</span>'
  +         '<span class="rec-pill '+STATUS_CLASS[ev.status]+'">'+STATUS_LABEL[ev.status]+'</span>'
  +       '</div>'
  +       '<div class="rec-meta" style="margin-top:6px">'
  +         '<span class="rec-date" style="margin:0">'+fmtDateLong(ev.when)+'</span>'
  +         '<span class="idcopy" data-copy="'+esc(ev.publicId)+'" title="Скопировать ID">ID: '+esc(ev.publicId)
  +           '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="1.6"/></svg>'
  +         '</span>'
  +       '</div>'
  +     '</div>'
  +   '</div>'
  + '</div>';

  /* ——— «Основная информация»: не сворачивается - единственное место, где
     живут категория/сущность/действие/паттерн/описание (раньше часть висела
     ещё и в шапке дублем; теперь в шапке только ид+дата+теги) ——— */
  const secMain = panel('Основная информация', dl(4,[
    ['Дата', fmtDateLong(ev.when)],
    ['Категория', CATEGORY_LABEL[t.cat]],
    ['Сущность', ENTITY_LABEL[t.ent]||t.ent],
    ['Действие', ACTION_LABEL[t.act]||t.act],
    ['Технический паттерн', t.code, 'mono', true],
  ])
  // «Описание» - текст переменной длины (это target.description из каталога
  // целей, а не короткое значение параметра), поэтому не колонка dl(), а
  // отдельный абзац на всю ширину панели - длинный текст не сжимается в ячейку
  + '<div class="main-desc"><dt>Описание</dt><dd>'+esc(t.desc)+'</dd></div>');

  /* ——— «Результат»: статус и причина ошибки переехали направо и не
     сворачиваются - это первое, что должно быть видно без скролла по
     левой колонке, а не поле в середине длинной формы ——— */
  const secResult = panel('Результат', dl(1,[
    ['Статус', statusBadge(ev.status), '', true],
    ['Причина ошибки', ev.failureReason||'—', ev.failureReason?'':'muted', true],
  ]));

  /* ——— признаки заполненности: теперь решают только текст подсказки в шапке
     свёрнутой секции, не open/collapsed - все секции ниже «Результата» всегда
     свёрнуты по умолчанию ——— */
  const changesFilled = !!ev.changes;
  const contextFilled = !!(ev.ip || ev.origin || ev.ua || ev.deviceId);

  /* ——— 1. Кто сделал / вошёл — всегда свёрнуто по умолчанию (заполненность
     решает только текст в подсказке, а не открыт ли блок). В подсказке
     всегда виден тип актора (Клиент/Администратор/Система) - это должно
     читаться, даже не разворачивая секцию ——— */
  const actorLinkAttr = ev.actorType==='ADMIN' ? 'data-noop' : 'data-acct-link="'+esc(a.id)+'"';
  const actorTypeLabel = ACTOR_TYPE_LABEL[ev.actorType];
  let actorHint, actorBody;
  if(ev.actorType==='SYSTEM'){
    actorHint = actorTypeLabel + ' · ' + a.sysLabel;
    actorBody = dl(4,[
      ['Инициатор', 'Системный процесс', 'muted', true],
      ['Идентификатор', a.id, 'mono'],
      ['Тип актора', actorTypeLabel],
    ]);
  } else if(a.id==='anonymous'){
    actorHint = actorTypeLabel + ' · не авторизован';
    actorBody = dl(4,[
      ['Клиент', '<span class="muted">Не определён</span>', '', true],
      ['Роль на момент события', '—', 'muted'],
      ['Тип актора', actorTypeLabel],
      ['Идентификатор', 'anonymous', 'mono'],
    ]);
  } else {
    // приоритет отображения: имя -> email -> id. Что бы ни показали - это
    // всегда кликабельная ссылка на карточку (для клиента - реальный переход,
    // для админа - пока заглушка, карточки администратора в системе нет)
    const actorPrimary = a.name || a.email || a.id;
    actorHint = actorTypeLabel + ' · ' + actorPrimary;
    actorBody = dl(4,[
      [ev.actorType==='ADMIN'?'Администратор':'Клиент',
        '<a href="#" class="namelink" '+actorLinkAttr+'>'+esc(actorPrimary)+'</a>'
        + (a.name&&a.email?'<div class="cell-sub">'+esc(a.email)+'</div>':''), '', true],
      ['Роль на момент события', a.role||'—', a.role?'':'muted'],
      ['Тип актора', actorTypeLabel],
      ['Идентификатор', a.id, 'mono'],
    ]);
  }
  // заголовок один на все ~400+ паттернов, без спецкейса под конкретную пару
  // сущность+действие ("вход" от "сделал" здесь ничем принципиально не отличается,
  // а завязываться на конкретные ent/act в заголовке - не масштабируется)
  const secActor = detailSection('Кто сделал', actorHint, actorBody, false);

  /* ——— 2. Над чем — тоже всегда свёрнуто, в подсказке всегда тип сущности,
     даже если самого объекта (id) нет ——— */
  const secTarget = detailSection('Над чем', ENTITY_LABEL[t.ent]||t.ent, dl(3,[
    ['Тип объекта', ENTITY_LABEL[t.ent]||t.ent],
    // ID везде в карточке - целиком (Идентификатор актора, Объект, Технические
    // детали); сокращаем только в списке событий, там это про плотность строк
    ['Объект', ev.target.id ? '<a href="#" class="namelink mono" data-noop>'+esc(ev.target.id)+'</a>' : '—', ev.target.id?'':'muted', true],
    ['Клиент', ev.ownerId ? '<a href="#" class="namelink" data-acct-link="'+esc(ev.ownerId)+'">'+esc(ev.ownerId)+'</a>' : '—', ev.ownerId?'mono':'muted', true],
  ]), false);

  /* ——— 3. Что изменилось — колонка «Поле» без перевода: имена полей мутации
     не переводятся, это не закрытый справочник как категория/сущность.
     Всегда свёрнуто; подсказка - "Нет данных" (единое написание с Контекстом
     и Связанными записями) или количество изменённых полей ——— */
  const changesHint = changesFilled
    ? ev.changes.length+' '+plural(ev.changes.length,'поле','поля','полей')+' изменено'
    : 'Нет данных';
  const secChanges = detailSection('Что изменилось', changesHint,
    changesFilled
      ? '<div class="twrap"><table class="grid"><thead><tr><th>Поле</th><th>Было</th><th>Стало</th></tr></thead><tbody>'
        + ev.changes.map(c=>'<tr><td><span class="mono">'+esc(c.field)+'</span></td>'
          + '<td>'+(c.from?'<span class="diffold">'+esc(c.from)+'</span>':'<span class="muted">не передано</span>')+'</td>'
          + '<td><span class="mono">'+esc(c.to)+'</span></td></tr>').join('')
        + '</tbody></table></div>'
      : '<div class="empty-state"><div class="big">Нет данных</div>Пара «было → стало» для этого события не пришла</div>',
    false);

  /* ——— 4. Контекст — всегда свёрнуто, подсказка "Нет данных" либо источник ——— */
  const contextHint = contextFilled ? SOURCE_LABEL[ev.source] : 'Нет данных';
  const secContext = detailSection('Контекст', contextHint,
    dl(4,[
      ['Источник', esc(SOURCE_LABEL[ev.source])+(ev.origin?'<div class="cell-sub">'+esc(ev.origin)+'</div>':''), '', true],
      ['IP-адрес', ev.ip||'—', ev.ip?'mono':'muted'],
      ['Расположение', ev.geoCountry||'Не определено', ev.geoCountry?'mono':'muted'],
      ['Устройство', ev.ua ? esc(ev.ua.os)+'<div class="cell-sub" style="word-break:break-all">'+esc(ev.ua.raw)+'</div>' : '—', ev.ua?'':'muted', true],
    ]) + dl(4,[
      ['ID устройства', ev.deviceId||'—', ev.deviceId?'mono':'muted'],
    ]),
    false);

  /* ——— секции «Связанные сущности» (metadata.relatedEntities/riskAssessment)
     здесь больше нет - убрана сознательно. По коду публикации выяснилось:
     relatedEntities в реальности всегда одна запись, а riskAssessment для
     единственного реального поставщика (KYT AML-решения) публикуется как
     { totalScore, riskClass, stepName } - GraphQL-тип же объявляет только
     { level, source, flags, score }. Имена не совпадают, значит для настоящих
     KYT-событий это поле всегда будет приходить пустым - показывать его
     красиво заполненным, как раньше в моке, было нечестно. ——— */

  /* ——— 6. Технические детали: свёрнуто всегда, независимо от заполненности -
     это не про важность данных, а про то, что читают только при трассировке.
     dl(1) - не 3 колонки: секция теперь в узком (300px) сайдбаре, длинные UUID
     в 3 колонки переносились по 4-5 строк каждый и превращались в кашу ——— */
  const secTech = detailSection('Технические детали', '', dl(1,[
    ['ID записи (UUID)', ev.id, 'mono'],
    ['ID цели в каталоге', ev.auditTargetId, 'mono'],
    ['Тип публикации', ev.targetType==='EVENT'?'EVENT':'GRAPHQL', 'mono'],
    ['Correlation ID', ev.correlationId, 'mono'],
    ['ID запроса', ev.requestId||'—', ev.requestId?'mono':'muted'],
    ['ID сеанса', ev.sessionId||'Не передан', ev.sessionId?'mono':'muted'],
  ]), false);

  /* ——— левая колонка = сюжет: читаешь по порядку, чтобы понять, что случилось.
     правая колонка = факты и связи: смотришь урывками, не по порядку, всегда
     на виду при скролле левой части. Связанные записи и связанные сущности -
     оба про "с чем это связано", просто на разных уровнях (другие строки
     журнала vs. другие объекты внутри этой строки), поэтому теперь рядом. ——— */
  const side = secResult + siblingsPanel(ev) + secTech;

  // карточка события — рабочая страница, не витрина: заморозки здесь нет
  return head
    + '<div class="rec-detail-grid">'
    +   '<div class="rec-detail-main">' + secMain + secActor + secTarget + secChanges + secContext + '</div>'
    +   '<div class="rec-detail-side">' + side + '</div>'
    + '</div>';
}

/** Правая sticky-панель карточки: другие записи с тем же correlationId -
 *  одно действие часто даёт не одну запись, а две (успех от сервиса-владельца
 *  + отказ или эхо от шлюза), но не всегда. Кликабельная строка ведёт в
 *  карточку той записи, поэтому биндится в bindDetail(). */
function siblingsPanel(ev){
  const sibs = EVENTS.filter(e=>e.correlationId===ev.correlationId && e.id!==ev.id);
  const filled = sibs.length>0;
  const body = filled
    ? sibs.map(s=>'<div class="sib-row" data-ev="'+s.id+'">'
        + '<div style="min-width:0"><div class="cell-strong" style="font-size:12.5px">'+esc(eventTitle(s.type))+'</div>'
        + '<div class="cell-sub">'+fmtDateShort(s.when)+'</div></div>'
        + statusBadge(s.status)
        + '</div>').join('')
    : '<p style="margin:0;font-size:12.5px;color:var(--text-soft)">Других записей по этому действию нет — пришла только одна строка в журнале.</p>';
  const hint = filled ? sibs.length+' '+plural(sibs.length,'запись','записи','записей') : 'Нет данных';
  // как и остальные вспомогательные секции - свёрнуто по умолчанию
  return detailSection('Связанные записи', hint, body, false);
}

/* =========================================================================
   RENDER / BIND
   ========================================================================= */
/** Верхние вкладки «Описание / Прототип» живут вне `.shell` и биндятся один раз
 *  при старте (см. низ файла) — сам переключатель не перерисовывается. render()
 *  только переключает видимость: либо страница «Описание» без сайдбара/хедера,
 *  либо обычный `.shell` с админкой внутри. */
function syncModeUI(){
  $all('.pt-toptabs [data-mode-tab]').forEach(b=>b.classList.toggle('active', b.dataset.modeTab===state.mode));
  const shell = $('#appShell'), descRoot = $('#descRoot');
  if(state.mode==='description'){
    shell.style.display = 'none';
    descRoot.style.display = 'block';
    $('.pt-descwrap', descRoot).innerHTML = renderDescription();
  } else {
    shell.style.display = '';
    descRoot.style.display = 'none';
  }
}
function render(){
  syncModeUI();
  if(state.mode==='description'){
    const want = '#mode=description';
    if(location.hash !== want){ history.replaceState(null,'',location.pathname+location.search+want); }
    window.scrollTo(0,0);
    return; // страница «Описание» статична, кроме верхних вкладок биндить нечего
  }
  // v2, список/статистика: шапка раздела - одна и та же, рендерится один раз
  // здесь и не меняется при переключении саб-табов; сами саб-табы идут сразу
  // под ней. В остальных случаях (v1, карточка события/клиента) - как раньше.
  const isV2Top = state.mode==='prototype2' && (state.view==='list'||state.view==='stats');
  let inner;
  if(isV2Top){
    inner = journalHeader() + statsSubtabs() + (state.view==='stats' ? renderStats() : renderList(false));
  } else {
    inner = state.view==='stats' ? renderStats()
      : state.view==='list' ? renderList()
      : state.view==='detail' ? renderDetail()
      : renderAccountPage(state.currentAccountId);
  }
  $('#stage').innerHTML = inner;
  const want = state.view==='detail' ? '#ev='+state.openId : '';
  if(location.hash !== want){ history.replaceState(null,'',location.pathname+location.search+want); }
  window.scrollTo(0,0);
  bindCommonLinks();
  if(isV2Top) bindStatsSubtabs();
  if(state.view==='stats') bindStats();
  else if(state.view==='list') bindList();
  else if(state.view==='detail') bindDetail();
  else bindAccountPage();
}
/** Ссылки, общие для списка и карточки события: переход в аккаунт клиента
 *  и заглушка для того, чего в прототипе нет (объекты сущностей, карточка админа). */
function bindCommonLinks(){
  $all('[data-acct-link]').forEach(el=>el.addEventListener('click', e=>{
    e.preventDefault(); e.stopPropagation();
    openAccount(el.dataset.acctLink);
  }));
  $all('[data-noop]').forEach(el=>el.addEventListener('click', e=>{
    e.preventDefault(); e.stopPropagation();
    toast('В прототипе переход к сущности не реализован');
  }));
}
function renderInto(){ /* мягкая перерисовка без потери фокуса в поиске */
  const val = $('#evSearch') ? $('#evSearch').value : null;
  const pos = $('#evSearch') ? $('#evSearch').selectionStart : null;
  $('#stage').innerHTML = renderList();
  bindCommonLinks(); bindList();
  if(val!==null){ const i=$('#evSearch'); if(i){ i.focus(); i.setSelectionRange(pos,pos); } }
}
function closeAllPopovers(){
  let changed=false;
  if(state.openFilterMenu){ state.openFilterMenu=null; changed=true; }
  if(state.exportOpen){ state.exportOpen=false; changed=true; }
  if(state.dateUI.open){ state.dateUI.open=false; changed=true; }
  if(changed) render();
}
document.addEventListener('click', closeAllPopovers);

// копирование ID по клику - один делегированный обработчик на весь документ,
// работает после любого render() без повторной привязки. [data-copy] - полное
// значение, которое уходит в буфер (не сокращённое, которое видно на экране).
// Слушатель на фазе перехвата (true) - иначе клик по копированию внутри строки
// таблицы сначала долетит до обработчика самой строки и откроет карточку.
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-copy]');
  if(!t) return;
  e.preventDefault(); e.stopPropagation();
  const val = t.dataset.copy;
  (navigator.clipboard ? navigator.clipboard.writeText(val) : Promise.reject()).then(
    ()=>toast('Скопировано: '+val), ()=>toast('Не удалось скопировать')
  );
}, true);

function bindList(){
  $all('.popwrap').forEach(w=>w.addEventListener('click', e=>e.stopPropagation()));

  $all('.seg-tab[data-tab]').forEach(b=>b.addEventListener('click', ()=>{ state.filters.tab=b.dataset.tab; state.page=1; render(); }));

  $('#evSearch')?.addEventListener('input', e=>{ state.filters.q=e.target.value; state.page=1; renderInto(); });

  // клик по Correlation ID в таблице - подставляет значение в поиск вместо
  // перехода в карточку (stopPropagation, строка кликабельна сама по себе)
  $all('.corr-link').forEach(a=>a.addEventListener('click', e=>{
    e.preventDefault(); e.stopPropagation();
    state.filters.q = a.dataset.corr; state.page=1; render();
  }));

  $all('[data-fmenu]').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation();
    const k=b.dataset.fmenu;
    state.openFilterMenu = state.openFilterMenu===k ? null : k;
    state.exportOpen=false; state.dateUI.open=false; render();
  }));
  $all('[data-opt]').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation();
    state.filters[b.dataset.opt]=b.dataset.val; state.openFilterMenu=null; state.page=1; render();
  }));

  $('#clearAll')?.addEventListener('click', e=>{
    e.preventDefault();
    Object.assign(state.filters,{tab:'',q:'',cat:'',ent:'',act:'',sev:'',status:'',src:'',from:null,to:null});
    state.page=1; render(); toast('Фильтры сброшены');
  });

  $all('th[data-sort]').forEach(h=>h.addEventListener('click', ()=>{
    const k=h.dataset.sort;
    if(state.sort.key===k) state.sort.dir = state.sort.dir==='asc'?'desc':'asc';
    else { state.sort.key=k; state.sort.dir = k==='when'?'desc':'asc'; }
    render();
  }));

  $('#pageSize')?.addEventListener('change', e=>{ state.pageSize=Number(e.target.value); state.page=1; render(); });
  $all('[data-page]').forEach(b=>b.addEventListener('click', ()=>{
    const v=b.dataset.page;
    const pages = Math.max(1, Math.ceil(filtered().length/state.pageSize));
    if(v==='prev') state.page=Math.max(1,state.page-1);
    else if(v==='next') state.page=Math.min(pages,state.page+1);
    else state.page=Number(v);
    render();
  }));

  bindExportControl();
  bindDateRangeControl();

  /* переход в карточку */
  $all('tr[data-ev]').forEach(tr=>tr.addEventListener('click', ()=>{ state.openId=tr.dataset.ev; state.view='detail'; render(); }));
}

/** Бинды попапа периода - общие для «Журнала» и «Сводной статистики» (v2),
 *  раз разметка (dateRangeControl()) у них теперь тоже одна на двоих. */
/** Бинд кнопки «Экспорт» из journalHeader() - общей шапки, значит и бинд
 *  общий (список и статистика в v2, плюс список в v1). */
function bindExportControl(){
  $('#exportBtn')?.addEventListener('click', e=>{ e.stopPropagation(); state.exportOpen=!state.exportOpen; state.dateUI.open=false; state.openFilterMenu=null; render(); });
  $all('[data-export]').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation();
    const fmt={csv:'CSV',xlsx:'Excel',pdf:'PDF'}[b.dataset.export];
    state.exportOpen=false; render(); toast('Экспорт в '+fmt+' запущен — '+filtered().length+' строк');
  }));
}
function bindDateRangeControl(){
  $('#dateRangeBtn')?.addEventListener('click', e=>{
    e.stopPropagation();
    if(!state.dateUI.open){
      state.dateUI.viewMonth = state.filters.from || new Date(2026,7,1);
      state.dateUI.tempFrom = state.filters.from; state.dateUI.tempTo = state.filters.to;
      state.dateUI.open = true;
    } else state.dateUI.open=false;
    state.exportOpen=false; state.openFilterMenu=null; render();
  });
  $all('[data-calnav]').forEach(b=>b.addEventListener('click', ()=>{
    const dir=b.dataset.calnav==='prev'?-1:1;
    const v=state.dateUI.viewMonth||new Date();
    state.dateUI.viewMonth=new Date(v.getFullYear(), v.getMonth()+dir, 1); render();
  }));
  $all('[data-day]').forEach(c=>c.addEventListener('click', ()=>{
    const [yy,mm,dd]=c.dataset.day.split('-').map(Number);
    const picked=d0(yy,mm,dd), u=state.dateUI;
    if(!u.tempFrom || (u.tempFrom && u.tempTo)){ u.tempFrom=picked; u.tempTo=null; }
    else { if(picked<u.tempFrom){ u.tempTo=u.tempFrom; u.tempFrom=picked; } else u.tempTo=picked; }
    render();
  }));
  $all('[data-quick]').forEach(b=>b.addEventListener('click', ()=>{
    const [f,t]=quickRanges()[b.dataset.quick];
    state.dateUI.tempFrom=f; state.dateUI.tempTo=t; state.dateUI.viewMonth=f; render();
  }));
  $('#dateReset')?.addEventListener('click', ()=>{ state.filters.from=null; state.filters.to=null; state.dateUI.open=false; state.page=1; render(); });
  $('#dateApply')?.addEventListener('click', ()=>{
    state.filters.from=state.dateUI.tempFrom; state.filters.to=state.dateUI.tempTo;
    state.dateUI.open=false; state.page=1; render();
  });
}

function bindDetail(){
  $('#backToList')?.addEventListener('click', e=>{ e.preventDefault(); state.view='list'; state.openId=null; render(); });
  $all('.sib-row[data-ev]').forEach(row=>row.addEventListener('click', ()=>{
    state.openId = row.dataset.ev; render();
  }));
}

/* верхние вкладки живут вне `.shell` и не перерисовываются — бинд один раз */
$all('.pt-toptabs [data-mode-tab]').forEach(b=>b.addEventListener('click', ()=>{
  if(state.mode===b.dataset.modeTab) return;
  state.mode = b.dataset.modeTab;
  // «Сводная статистика» существует только в v2 - уходя из v2 со открытой
  // статистикой, возвращаемся на список, чтобы v1 её не унаследовал
  if(state.mode!=='prototype2' && state.view==='stats') state.view='list';
  render();
}));

/* прямая ссылка: …#ev=<id> — карточка события, …#mode=description — вкладка «Описание» */
(function(){
  const h = location.hash || '';
  if(h === '#mode=description'){ state.mode = 'description'; return; }
  const m = h.match(/^#ev=(.+)$/);
  if(m && EVENTS.some(e=>e.id===m[1])){ state.view='detail'; state.openId=m[1]; }
})();

render();
</script>
</body>
</html>
