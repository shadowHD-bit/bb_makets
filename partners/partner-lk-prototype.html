const MONTHS_RU = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
function datePicker(f, value) {
  const id = 'cal-' + f;
  const [vy, vm, vd] = value.split('-').map(Number);
  const open = S.cal && S.cal.id === id;
  const y = open ? S.cal.y : vy;
  const m = open ? S.cal.m : vm - 1;
  const first = (new Date(y, m, 1).getDay() + 6) % 7;
  const dim = new Date(y, m + 1, 0).getDate();
  const today = new Date();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push('<span></span>');
  for (let d = 1; d <= dim; d++) {
    const sel = y === vy && m === vm - 1 && d === vd;
    const isToday = y === today.getFullYear() && m === today.getMonth() && d === today.getDate();
    cells.push(`<button type="button" data-act="cal-set" data-f="${f}" data-v="${y}-${pad(m + 1)}-${pad(d)}" class="flex size-9 items-center justify-center rounded-full text-label-xs transition ${sel ? 'bg-primary-base text-static-white' : isToday ? 'text-primary-base hover:bg-bg-weak-50' : 'text-text-strong-950 hover:bg-bg-weak-50'}">${d}</button>`);
  }
  return `
<div class="relative">
  <button type="button" data-act="cal-open" data-id="${id}" data-f="${f}" class="flex w-full items-center gap-2 rounded-10 border bg-bg-white-0 px-3 py-2.5 text-left text-label-sm text-text-strong-950 transition ${open ? 'border-stroke-sub-300' : 'border-stroke-soft-200 hover:border-stroke-sub-300'}">
    ${I('calendar-2-line', 'text-lg text-text-soft-400')}<span class="whitespace-nowrap">${pad(vd)}.${pad(vm)}.${vy}</span>
  </button>
  ${open ? `<div class="absolute left-0 top-[calc(100%+6px)] z-30 w-[300px] rounded-[16px] border border-stroke-soft-200 bg-bg-white-0 p-3 shadow-regular-md">
    <div class="mb-2 flex items-center justify-between">

      <span class="text-label-sm text-text-strong-950">${MONTHS_RU[m]} ${y}</span>
      <button type="button" data-act="cal-nav" data-d="1" class="flex size-8 items-center justify-center rounded-full border border-stroke-soft-200 text-text-sub-600 hover:bg-bg-weak-50">${I('arrow-right-s-line', 'text-base')}</button>
    </div>
    <div class="grid grid-cols-7 gap-y-0.5 text-center">
      ${['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map((w) => `<span class="flex h-8 items-center justify-center text-subheading-2xs uppercase text-text-soft-400">${w}</span>`).join('')}
      ${cells.join('')}
    </div>
  </div>` : ''}

}

const KIND_ICON = { sbp: 'qr-code-line', iban: 'bank-line', topup: 'arrow-down-line', withdraw: 'arrow-up-line', transfer: 'arrow-left-right-line', exchange: 'exchange-line', otc: 'exchange-funds-line' };
const isClientOp = (h) => h.k === 'sbp' || h.k === 'iban';
const toFrom = (h) => {
  if (h.cl) return `Клиент ${h.cl}`;
  if (h.k === 'topup') return mask(h.from);
  if (h.k === 'withdraw') return mask(h.to);
  if (h.k === 'transfer') return h.dir;
  if (h.k === 'exchange') return 'RUBR → USDT';
  return '—';
};

function amountCell(h) {
  const dead = h.st === 'canceled' || h.st === 'error';
  const lines = h.legs.map((l) => `<span class="${cx(l.a > 0 && !dead && 'text-state-success', dead && 'text-text-soft-400 line-through')}">${signed(l.a)} ${l.c}</span>`).join('');
  let extra = '';
  if (h.k === 'sbp' && h.st === 'done') extra = `<span class="text-paragraph-xs text-text-soft-400">QR ${num(h.qr)}</span>`;
  if (h.k === 'sbp' && h.st === 'pending') extra = `<span class="text-paragraph-xs text-text-soft-400">к зачислению</span>`;
  return `<div class="flex flex-col gap-0.5 whitespace-nowrap font-mono text-label-sm leading-5 tabular-nums">${lines}${extra}</div>`;
}

function filteredHistory() {
  const F = S.F;
  return S.H.filter((h) => {
    if (F.circuit === 'clients' && !isClientOp(h)) return false;
    if (F.circuit === 'own' && isClientOp(h)) return false;
    if (F.source !== 'all' && h.src !== F.source) return false;
    if (F.op !== 'all' && OPNAME[h.k] !== F.op) return false;
    if (F.type !== 'all' && KIND_TYPE[h.k] !== F.type) return false;
    if (F.status !== 'all' && h.st !== F.status) return false;
    if (F.period !== 'all' && h.age > Number(F.period)) return false;
    if (F.cid && !(h.cl || '').toLowerCase().includes(F.cid.toLowerCase())) return false;
    if (F.q) {
      const q = F.q.toLowerCase().replace(/\s/g, '');
      const hay = [h.id, h.hash, h.cl, ...h.legs.map((l) => String(Math.abs(l.a)))].join('|').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function pill(id, label, value, options, isNew = false) {
  const cur = options.find(([v]) => v === value);
  const open = S.pill === id;
  return `
<div class="relative" ${isNew ? 'data-new="s"' : ''}>
  <button type="button" data-act="pill" data-id="${id}" class="flex h-7 shrink-0 items-stretch rounded-full border border-stroke-soft-200 transition-colors hover:border-stroke-sub-300">
    <span class="flex items-center pl-3 pr-2.5 text-label-xs text-text-soft-400">${label}</span>
    <span class="flex items-center gap-1 border-l border-stroke-soft-200 pl-2.5 pr-3 text-label-xs text-text-strong-950">${cur ? cur[1] : ''}${I('expand-up-down-line', 'text-sm text-text-soft-400')}</span>
  </button>
  ${open ? `<div class="absolute left-0 top-9 z-30 w-[220px] rounded-[12px] border border-stroke-soft-200 bg-bg-white-0 p-1.5 shadow-regular-md">
    ${options.map(([v, l]) => `<button type="button" data-act="pill-set" data-id="${id}" data-v="${v}" class="flex w-full items-center justify-between rounded-8 px-2.5 py-2 text-left text-paragraph-xs ${v === value ? 'bg-bg-weak-50 text-text-strong-950' : 'text-text-sub-600 hover:bg-bg-weak-50'}">${l}${v === value ? I('check-line', 'text-sm text-primary-base') : ''}</button>`).join('')}

</div>`;
}

  const rows = filteredHistory();

  rows.filter((h) => h.st === 'done').forEach((h) => h.legs.forEach((l) => {
    tot[l.c] = tot[l.c] || { in: 0, out: 0 };
    if (l.a > 0) tot[l.c].in += l.a; else tot[l.c].out += -l.a;

    ${pill('f-source', 'Источник счета', S.F.source, [['all', 'Все'], ['Виджет', 'Виджет'], ['API', 'API'], ['Ручная ссылка', 'Ручная ссылка']], true)}
    ${pill('f-op', 'Операция', S.F.op, [['all', 'Все'], ['Пополнение', 'Пополнение'], ['Вывод', 'Вывод'], ['Перевод', 'Перевод'], ['Обмен', 'Обмен'], ['OTC', 'OTC']])}
    ${pill('f-type', 'Тип', S.F.type, [['all', 'Все'], ['Крипто', 'Крипто'], ['Фиат', 'Фиат']])}
    ${pill('f-status', 'Статус', S.F.status, STATUS_OPTS)}
    ${pill('f-period', 'Период', S.F.period, PERIODS)}
  </div>
  <div class="flex w-full flex-wrap items-center gap-2">

<div data-new class="mx-4 mb-4 flex flex-wrap items-center gap-3 rounded-12 bg-bg-weak-50 px-4 py-3">

</div>`;

  const th = (t, cls = '') => `<th class="h-9 px-3 text-left align-middle text-label-xs font-normal text-text-soft-400 ${cls}"><span class="inline-flex items-center gap-1">${t}</span></th>`;
  const body = rows.length ? rows.map((h) => `
<tr data-act="open-tx" data-id="${h.id}" class="h-[72px] cursor-pointer border-b border-stroke-soft-200/50 transition-colors last:border-none hover:bg-bg-weak-50/60">
  <td class="px-3"><div class="flex items-center gap-3">${coin(h.legs[h.legs.length > 1 ? 1 : 0].c)}<span class="flex flex-col gap-1"><span class="truncate text-label-sm text-text-strong-950">${h.legs.map((l) => l.c).join(' / ')}</span><span class="whitespace-nowrap font-mono text-paragraph-xs leading-4 text-text-soft-400">${h.tm}</span></span></div></td>
  <td class="px-3">${amountCell(h)}</td>
  <td class="px-3"><span class="whitespace-nowrap text-label-sm text-text-strong-950">${OPNAME[h.k]}</span></td>
  <td class="px-3"><span class="inline-flex items-center gap-1.5 whitespace-nowrap text-paragraph-xs text-text-sub-600">${toFrom(h)}${h.from || h.to ? copyBtn(h.from || h.to) : ''}</span></td>
  <td class="px-3"><span class="inline-flex items-center gap-1.5 truncate text-paragraph-xs text-text-sub-600">${h.hash ? mask(h.hash) + copyBtn(h.hash) + I('arrow-right-up-line', 'text-base') : '—'}</span></td>

  const f = [];

  if (h.k === 'sbp') {
    f.push(['Способ', 'СБП'], ['Клиент', h.cl], ['Номер счета', '№' + h.n],
      ['Ссылка на оплату', `<span class="inline-flex items-center gap-1 font-mono text-paragraph-xs">${h.link}${copyBtn(h.link)}</span>`],
      ['Срок оплаты', h.due ? 'До ' + h.tm.slice(0, 10) + ', ' + h.due : '—'],
      ['Сумма QR', num(h.qr) + ' RUBR'], ['Комиссия BitBanker', num(h.bb) + ' RUBR'], ['Комиссия партнера', num(h.pf) + ' RUBR'],
      ['Источник счета', h.src]);
    if (h.conv) f.push(['Конвертация', h.conv]);
  } else if (h.k === 'iban') {
    f.push(['Способ', 'IBAN'], ['Клиент', h.cl], ['Номер заявки', '№' + h.n], ['Получатель', h.rcp], ['Тело платежа', num(h.body) + ' USDT'],
      ['Комиссия BitBanker', num(h.bbfee) + ' USDT'], ['Сумма зачисления', h.credit], ['Курс провайдера', h.rate]);
  } else if (h.k === 'topup') {
    f.push(['Способ', 'Крипто'], ['Сеть', 'TRC-20'], ['Адрес отправителя', `<span class="inline-flex items-center gap-1 font-mono text-paragraph-xs">${mask(h.from)}${copyBtn(h.from)}</span>`],
      ['Хэш', `<span class="inline-flex items-center gap-1 font-mono text-paragraph-xs">${mask(h.hash)}${copyBtn(h.hash)}</span>`], ['Счет зачисления', 'Счет выплат'], ['Результат AML-проверки', h.st === 'review' ? 'Выполняется' : 'Пройдена']);
  } else if (h.k === 'exchange') {
    f.push(['Способ', 'Стакан'], ['Списано', num(-h.legs[0].a) + ' RUBR'], ['Получено', num(h.legs[1].a) + ' USDT'], ['Средний курс', h.rate + ' RUBR/USDT'], ['Комиссия тейкера', h.fee], ['Ордер', h.ord], ['Сделки', 'Список сделок, из которых сложился средний курс']);
  } else if (h.k === 'otc') {
    f.push(['Способ', 'OTC'], ['Номер сделки', h.deal], ['Списано', num(-h.legs[0].a) + ' RUBR'], ['Получено', num(h.legs[1].a) + ' USDT'], ['Курс сделки', h.rate + ' RUBR/USDT'], ['Комиссия', '0'], ['Подтверждение сделки', 'Файл']);
  } else if (h.k === 'transfer') {

/* ---------- действия ---------- */
function setPath(path, value) {
  const parts = path.split('.');
  let o = S;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = value;
}
function getPath(path) {
  return path.split('.').reduce((o, k) => o[k], S);
}
function go(to) {
  if (to === 'home' && !S.partner) { S.route = 'home'; return; }
  S.route = to;
  S.modal = null;
  S.pill = null;
}
function setFlag(k, v) {
  if (k === 'admin') S.admin = v;
  else if (k === 'hl') S.hl = v;
  else if (k === 'partner') {
    S.partner = v;
    S.route = 'home';
  } else if (k === 'manual') { S.manual = v; if (!v && S.route === 'kyc-sbp') S.route = 'home'; }
  else if (k === 'iban') { log('Открытие и закрытие направлений', v ? 'Закрыто' : 'Открыто', v ? 'Открыто' : 'Закрыто', 'Оператор'); S.iban = v; }
  else if (k === 'conv') { log('Автоконвертация в USDT', v ? 'Выключена' : 'Включена', v ? 'Включена' : 'Выключена'); S.conv = v; }
  else if (k === 'convBal') { log('Автоконвертация накопленного остатка', v ? 'Выключена' : 'Включена', v ? 'Включена' : 'Выключена'); S.convBal = v; }
  else if (k === 'aw') { log('Автовывод', v ? 'Выключен' : 'Включен', v ? 'Включен' : 'Выключен'); S.aw = v; }
}
function applyAddress(addr) {
  if (/^TBAD/i.test(addr)) { toast('Адрес не прошел AML-проверку и не сохранен'); return false; }
  if (addr !== S.c.awAddr) {
    log('Адрес кошелька автовывода', mask(S.c.awAddr), mask(addr));
    S.c.awAddr = addr; S.d.awAddr = addr;
    startPause();
    if (paused()) toast(pauseText());
  }
  return true;
}

  'save-aw': () => {
    if (!applyAddress(S.d.awAddr.trim())) { S.d.awAddr = S.c.awAddr; return; }
    log('Нижний порог автовывода', S.c.awLow + ' USDT', S.d.awLow + ' USDT');
    log('Верхний порог автовывода', S.c.awUp + ' USDT', S.d.awUp + ' USDT');
    S.c.awLow = S.d.awLow; S.c.awUp = S.d.awUp;
    if (!paused()) toast('Автовывод сохранен');
  },
  reissue: () => {
    S.secret = 'bb_sk_' + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 12);
    S.secretFresh = true; log('Перевыпуск секрета', '—', 'Секрет перевыпущен'); toast('Секрет перевыпущен');
  },
  'save-hooks': () => {
    log('Адрес вебхука о статусе оплаты', S.c.hook1 || 'не задан', S.d.hook1 || 'не задан');
    log('Адрес вебхука о событиях', S.c.hook2 || 'не задан', S.d.hook2 || 'не задан');
    S.c.hook1 = S.d.hook1; S.c.hook2 = S.d.hook2; toast('Адреса сохранены');
  },
  'upload-doc': () => { S.docs.push({ g: 'Документы KYB', n: 'Новый документ.pdf', d: fmtDT(new Date()).slice(0, 10) }); toast('Документ загружен'); },
  'del-doc': (e) => { S.docs.splice(Number(e.dataset.i), 1); toast('Документ удален оператором'); },
  copy: (e) => { try { navigator.clipboard.writeText(e.dataset.v); } catch (x) { /* без буфера */ } toast('Скопировано'); },
  toast: (e) => toast(e.dataset.v),
  rerender: () => {},
  'dd-open': (e) => { const id = e.dataset.id; S.dd = S.dd === id ? null : id; S.pill = null; S.cal = null; },
  'dd-set': (e) => { setPath(e.dataset.f, e.dataset.v); S.dd = null; },
  'cal-open': (e) => {
    const id = e.dataset.id;
    if (S.cal && S.cal.id === id) { S.cal = null; return; }
    const [y, m] = getPath(e.dataset.f).split('-').map(Number);
    S.cal = { id, y, m: m - 1 }; S.dd = null; S.pill = null;
  },
  'cal-nav': (e) => { const d = Number(e.dataset.d); let m = S.cal.m + d, y = S.cal.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.cal = { ...S.cal, y, m }; },
  'cal-set': (e) => { setPath(e.dataset.f, e.dataset.v); S.cal = null; },
  chk: (e) => { setPath(e.dataset.f, !getPath(e.dataset.f)); },
  'kyc-check': () => {
    const id = S.kyc.id.trim();
    S.kyc.link = ''; S.kyc.payLink = ''; S.kyc.err = '';
    if (!id) { S.kyc.err = 'Введите ID клиента'; S.kyc.state = null; return; }
    S.kyc.state = id.endsWith('200') ? 'check' : id.endsWith('300') ? 'ok' : id.endsWith('400') ? 'rej' : 'new';
  },
  'kyc-create': () => {
    const k = S.kyc; k.err = '';
    if (k.state === 'new') {
      if (!k.email.trim()) { k.err = 'Email клиента обязателен при первом обращении'; return; }
      if (k.create && !(parseFloat(k.amount) > 0)) { k.err = 'Укажите сумму оплаты'; return; }
    }
    k.link = 'https://kyc.bitbanker.org/s/' + Math.random().toString(36).slice(2, 10);
    k.state = 'check';
  },
  'kyc-pay': () => {
    const k = S.kyc;
    if (!(parseFloat(k.amount) > 0)) { k.err = 'Укажите сумму оплаты'; return; }
    k.err = ''; k.payLink = 'https://pay.bitbanker.org/q/' + Math.random().toString(36).slice(2, 8);
    S.H.unshift({ id: 'TX-' + Math.random().toString(16).slice(2, 10).toUpperCase(), k: 'sbp', st: 'pending', age: 0, tm: fmtDT(new Date()), due: pad(new Date().getHours()) + ':' + pad((new Date().getMinutes() + 15) % 60), legs: [{ c: 'RUBR', a: parseFloat(k.amount) }], qr: parseFloat(k.amount) * 1.0173, cl: 'R' + k.id.replace(/\D/g, '').slice(0, 6), src: 'Ручная ссылка', bb: parseFloat(k.amount) * 0.0173, pf: parseFloat(k.amount) * 0.015, link: k.payLink, n: String(4913 + S.H.length) });
    toast('Оплата выставлена и появилась в истории');
  },
  'pause-on': () => { startPause(); if (paused()) toast(pauseText()); else toast('Пауза не задана (0 часов)'); },
  'pause-off': () => { S.pauseUntil = null; },
  'scn-new': () => {
    const n = new Date(); const amt = [3000, 7500, 12000, 25000][Math.floor(Math.random() * 4)];
    S.H.unshift({ id: 'TX-' + Math.random().toString(16).slice(2, 10).toUpperCase(), k: 'sbp', st: 'pending', age: 0, tm: fmtDT(n), due: pad(n.getHours()) + ':' + pad((n.getMinutes() + 15) % 60), legs: [{ c: 'RUBR', a: amt }], qr: amt * 1.0173, cl: 'R' + (100000 + Math.floor(Math.random() * 899999)), src: ['API', 'Виджет', 'Ручная ссылка'][Math.floor(Math.random() * 3)], bb: amt * 0.0173, pf: amt * 0.015, link: 'https://pay.bitbanker.org/q/' + Math.random().toString(36).slice(2, 8), n: String(4913 + S.H.length) });
    toast('Оплата клиента выставлена: статус «Ожидает»');
  },
  'scn-paid': () => {
    const h = S.H.find((x) => x.k === 'sbp' && x.st === 'pending');
    if (!h) { toast('Нет ожидающих оплат'); return; }
    h.st = 'done'; delete h.due; S.bal.rub += h.legs[0].a; toast('Оплата прошла: статус «Завершено»');
  },
  'scn-exp': () => {
    const h = S.H.find((x) => x.k === 'sbp' && x.st === 'pending');
    if (!h) { toast('Нет ожидающих оплат'); return; }
    h.st = 'canceled'; h.why = 'Срок оплаты вышел, оплаты не было (статус провайдера expired)'; toast('Срок вышел: статус «Отменено»');
  },
  'scn-blocked': () => { S.partner ? (S.route = 'blocked') : toast('Партнерский признак выключен'); },
  reset: () => { location.reload(); },
};

document.addEventListener('click', (ev) => {
  let t = ev.target.closest('[data-act]');
  if (!t) { if (S.pill || S.dd || S.cal) { S.pill = null; S.dd = null; S.cal = null; render(); } return; }
  if (!['dd-open', 'dd-set', 'pill', 'pill-set', 'cal-open', 'cal-nav', 'cal-set'].includes(t.dataset.act)) { S.pill = null; S.dd = null; S.cal = null; }
  if (t.dataset.act === 'close-modal-bg') { if (ev.target !== t) return; }
  else if (ev.target.closest('[data-stop]') && t.dataset.act === 'close-modal-bg') return;
  const fn = ACTIONS[t.dataset.act];
  if (!fn) return;
  if (t.dataset.act === 'copy' || t.dataset.act === 'open-tx') ev.stopPropagation();
  fn(t, ev);
  render();
});
const readVal = (t) => (t.dataset.f === 'pauseHours' ? (Number(String(t.value).replace(',', '.')) || 0) : t.value);
document.addEventListener('input', (ev) => {
  const t = ev.target.closest('[data-f]');
  if (!t) return;
  setPath(t.dataset.f, readVal(t));
  if (t.dataset.rerender && t.tagName === 'INPUT' && t.type === 'text') {
    const pos = t.selectionStart; const f = t.dataset.f;
    render();
    const again = document.querySelector(`[data-f="${f}"]`);
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (x) { /* ignore */ } }
  }
});
document.addEventListener('change', (ev) => {
  const t = ev.target.closest('[data-f]');
  if (!t) return;
  setPath(t.dataset.f, readVal(t));
  if (t.dataset.rerender) render();
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && S.modal) { S.modal = null; S.f = {}; render(); } });
S.f = {};
(function initFromHash() {
  const h = decodeURIComponent((location.hash || '').slice(1));
  if (!h) return;
  h.split(',').forEach((p) => {
    if (p === 'dark') S.theme = 'dark';
    else if (p === 'admin') S.admin = true;
    else if (p === 'hl') S.hl = true;
    else if (p.indexOf('zoom=') === 0) S.zoom = p.slice(5);
    else if (p === 'nopartner') S.partner = false;
    else if (p === 'noiban') S.iban = false;
    else if (p === 'nomanual') S.manual = false;
    else if (p === 'nopanel') S.panelOpen = false;
    else if (p === 'paused') { S.pauseUntil = Date.now() + 3 * 3600 * 1000; }
    else if (p.indexOf('bridge=') === 0) S.bridge = p.slice(7);
    else if (p.indexOf('modal=') === 0) { const m = p.slice(6); S.f = {}; S.modal = m === 'tx' ? { t: 'tx', id: S.H[0].id } : { t: m }; }
    else if (PARTNER_PAGES[p] || p.indexOf('r-') === 0) S.route = p;
  });
})();
render();
</script>
</body>
