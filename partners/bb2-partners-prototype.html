<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Партнёрские аккаунты — прототип</title>
<style>
:root{
  /* neutral scale — shared token names between current bb2 and the new-design concept */
  --text-strong:#171717;
  --text-sub:#5c5c5c;
  --text-soft:#a3a3a3;
  --text-disabled:#c7c7c7;
  --bg-app:#fafafa;
  --bg-white:#fff;
  --bg-weak:#f7f7f7;
  --bg-soft:#ebebeb;
  --stroke-soft:#ececec;
  --stroke-med:#e2e2e2;

  /* accent — bb2's real gradient is Tailwind purple-700 → purple-400 */
  --purple-50:#faf5ff; --purple-100:#f3e8ff; --purple-200:#e9d5ff; --purple-300:#d8b4fe;
  --purple-400:#c084fc; --purple-500:#a855f7; --purple-600:#9333ea; --purple-700:#7e22ce;
  --primary:#8b3ce0;
  --primary-hover:#7a2fd0;
  --primary-a10:rgba(139,60,224,.09);
  --primary-a14:rgba(139,60,224,.13);

  --success:#1fc16b; --success-bg:#e3f7ec; --success-dark:#0b4627;
  --warning:#fa7319; --warning-bg:#fff3eb; --warning-dark:#c77a12;
  --error:#fb3748; --error-bg:#ffebec; --error-dark:#a2131f;
  --info:#8b3ce0; --info-bg:#f5eefd;
  --faded:#8a8a8a; --faded-bg:#f2f2f2;

  --radius-6:6px;--radius-8:8px;--radius-10:10px;--radius-12:12px;--radius-16:16px;--radius-full:999px;
  --shadow-xs:0 1px 2px 0 rgba(10,13,20,.04);
  --shadow-sm:0 2px 4px 0 rgba(14,18,27,.03),0 6px 10px 0 rgba(14,18,27,.05);
  --shadow-pop:0 12px 24px 0 rgba(14,18,27,.10),0 1px 2px 0 rgba(14,18,27,.04);
  --font: -apple-system,"Segoe UI",ui-sans-serif,system-ui,sans-serif;
  --font-mono: ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --side-w:264px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg-app);color:var(--text-strong);font-family:var(--font);
  font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::placeholder{color:var(--text-soft)}
a{color:inherit}
.tabnum{font-variant-numeric:tabular-nums}
svg{display:block}

/* ============================================================ shell */
.shell{display:flex;min-height:100vh}

/* ============================================================ SIDEBAR — 1:1 replica, fully inert except Аккаунты / Внешние клиенты */
.side{
  width:var(--side-w);flex:0 0 var(--side-w);background:var(--bg-white);
  border-right:1px solid var(--stroke-soft);display:flex;flex-direction:column;height:100vh;
  position:sticky;top:0;
}
.side-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px}
.side-brand .mark{
  width:36px;height:36px;border-radius:var(--radius-full);flex:0 0 36px;
  background:linear-gradient(135deg,var(--purple-700),var(--purple-400));color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px;
}
.side-brand .who{min-width:0;flex:1}
.side-brand .name{font-size:14.5px;font-weight:600;color:var(--text-strong);line-height:1.25}
.side-brand .sub{font-size:11.5px;color:var(--text-soft);line-height:1.2;margin-top:1px}
.side-brand .expand{color:var(--text-soft);flex:0 0 16px;cursor:default}
.side-divider{border:0;border-top:1px solid var(--stroke-soft);margin:0 16px}

.side-scroll{flex:1;overflow-y:auto;padding:12px 12px 8px}
.side-group{margin-bottom:2px}
.side-group-label{
  font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-soft);padding:14px 8px 6px;
}
.side-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 8px;border:0;background:none;
  border-radius:var(--radius-8);font-size:13.5px;font-weight:500;color:var(--text-strong);
  text-align:left;cursor:default;-webkit-user-select:none;user-select:none;
}
.side-item .ic{width:17px;height:17px;flex:0 0 17px;color:var(--text-sub);display:flex;align-items:center;justify-content:center}
.side-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-item .chev{flex:0 0 12px;color:var(--text-soft)}
.side-item.group-open .ic,.side-item.group-open .lbl{color:var(--text-strong)}

.side-sub{display:flex;flex-direction:column;gap:1px;padding:2px 0 6px 6px;position:relative}
.side-sub .side-item{font-size:13px;padding:7px 8px 7px 10px}
.side-sub .side-item .ic{width:15px;height:15px;flex:0 0 15px}

.side-item.clickable{cursor:pointer}
.side-item.clickable:hover{background:var(--bg-weak)}
.side-item.clickable .mk{width:5px;height:5px;border-radius:99px;background:var(--purple-300);flex:0 0 5px;margin-left:4px;opacity:.9}
.side-item.nav-active .mk{background:var(--primary)}
.side-item.nav-active{
  background:var(--primary-a10);color:var(--primary);font-weight:500;
  box-shadow:inset 3px 0 0 0 var(--primary);border-radius:var(--radius-8);
}
.side-item.nav-active .ic{color:var(--primary)}

.side-foot{padding:12px}
.side-collapse{
  display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-soft);
  padding:8px 8px;cursor:default;
}

/* ============================================================ TOPBAR — 1:1 style, inert */
.topbar{
  height:56px;flex:0 0 56px;background:var(--bg-white);border-bottom:1px solid var(--stroke-soft);
  display:flex;align-items:center;justify-content:flex-end;padding:0 20px;position:sticky;top:0;z-index:5;
  gap:14px;
}
.lang-pill{
  display:flex;align-items:center;gap:6px;border:1px solid var(--stroke-med);border-radius:var(--radius-8);
  padding:6px 10px;font-size:12.5px;font-weight:500;color:var(--text-strong);cursor:default;
}
.lang-pill .flag{font-size:12px}
.lang-pill .chev{color:var(--text-soft);width:9px;height:9px}
.topbar-divider{width:1px;height:24px;background:var(--stroke-soft)}
.top-profile{display:flex;align-items:center;gap:9px;cursor:default}
.top-profile .av{
  width:32px;height:32px;border-radius:var(--radius-full);background:#ffe7c2;color:#a3660a;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;flex:0 0 32px;
  position:relative;
}
.top-profile .av .dot{position:absolute;bottom:-1px;right:-1px;width:8px;height:8px;border-radius:99px;background:var(--success);border:2px solid var(--bg-white)}
.top-profile .who .n{font-size:12.5px;font-weight:600;color:var(--text-strong);line-height:1.3}
.top-profile .who .e{font-size:11.5px;color:var(--text-soft);line-height:1.3}
.top-icon{width:30px;height:30px;border-radius:var(--radius-8);border:1px solid var(--stroke-med);display:flex;align-items:center;justify-content:center;color:var(--text-sub);cursor:default}

/* ============================================================ main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.stage{flex:1;padding:18px 20px 40px;width:100%}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:600;margin:0 0 3px;letter-spacing:-.01em}
.page-head p{margin:0;color:var(--text-sub);font-size:13px}
.page-actions{display:flex;gap:8px;flex-shrink:0}

/* Аккаунты — header card + segmented tabs (matches real bb2 screen) */
.acc-card{background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:20px;box-shadow:var(--shadow-xs);padding:22px 24px 16px;margin-bottom:14px}
.acc-card h1{font-size:19px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.acc-card p.sub{margin:0;color:var(--text-sub);font-size:12.5px}
.acc-hr{border:0;border-top:1px solid var(--stroke-soft);margin:16px 0 14px}
.seg-tabs{display:inline-flex;gap:2px;background:var(--bg-weak);padding:4px;border-radius:12px}
.seg-tab{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:500;color:var(--text-sub);cursor:pointer;border:0;background:none;white-space:nowrap}
.seg-tab:hover:not(.active):not(.locked){color:var(--text-strong)}
.seg-tab.active{background:var(--bg-white);color:var(--text-strong);box-shadow:var(--shadow-xs)}
.seg-tab.locked{color:var(--text-disabled);cursor:not-allowed}
.info-row{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-sub);font-weight:500;cursor:pointer;margin-bottom:14px;-webkit-user-select:none;user-select:none}
.info-row .chev{transition:transform .15s;color:var(--text-soft)}
.info-row.open .chev{transform:rotate(180deg)}
.info-panel{max-height:0;overflow:hidden;transition:max-height .18s ease}
.info-panel.open{max-height:120px}
.info-panel-inner{font-size:12.5px;color:var(--text-sub);background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-12);padding:12px 14px;margin:-6px 0 14px;line-height:1.6}
.namelink{color:var(--primary);font-weight:500;cursor:pointer;text-decoration:none}
.namelink:hover{text-decoration:underline}
.idlink{color:var(--primary);font-weight:500;font-family:var(--font-mono);font-size:11.5px;cursor:pointer;text-decoration:none}
.idlink:hover{text-decoration:underline}
.pagfoot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--stroke-soft);font-size:12px;color:var(--text-soft)}
.pagfoot .select{padding:5px 24px 5px 10px;font-size:12px}

.btn{
  display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-8);border:1px solid var(--stroke-med);
  background:var(--bg-white);color:var(--text-strong);font-size:12.5px;font-weight:500;padding:7px 13px;
  cursor:pointer;box-shadow:var(--shadow-xs);transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--bg-weak);border-color:#d4d4d4}
.btn:active{background:var(--bg-soft)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn-ghost:hover{background:var(--bg-weak)}
.btn-danger{color:var(--error-dark);border-color:#ffd0d4}
.btn-danger:hover{background:var(--error-bg)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--bg-white)}

.incident{
  display:flex;align-items:flex-start;gap:10px;background:var(--warning-bg);border:1px solid #ffe0c2;
  border-radius:var(--radius-10);padding:11px 14px;margin-bottom:16px;font-size:12.5px;color:var(--warning-dark);
}
.incident .dotpulse{width:8px;height:8px;border-radius:99px;background:var(--warning);margin-top:4px;flex:0 0 8px;
  box-shadow:0 0 0 0 rgba(250,115,25,.5);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(250,115,25,.45)}70%{box-shadow:0 0 0 7px rgba(250,115,25,0)}100%{box-shadow:0 0 0 0 rgba(250,115,25,0)}}
.incident b{color:var(--warning-dark)}
.incident .msg{flex:1}
.incident .link{color:var(--warning-dark);font-weight:600;text-decoration:underline;cursor:pointer;white-space:nowrap}

/* record-detail tab bar (mirrors real bb2 user-card tabs) */
.rtabs{display:flex;gap:2px;border-bottom:1px solid var(--stroke-soft);margin-bottom:18px;overflow-x:auto}
.rtab{
  padding:9px 4px;margin-right:18px;font-size:12.5px;font-weight:500;color:var(--text-disabled);
  border-bottom:2px solid transparent;cursor:not-allowed;background:none;border-top:0;border-left:0;border-right:0;white-space:nowrap;
}
.rtab.active{color:var(--primary);border-bottom-color:var(--primary);cursor:default}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-12);padding:13px 14px}
.kpi .lbl{font-size:11px;color:var(--text-soft);font-weight:500;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.kpi .val{font-size:21px;font-weight:600;letter-spacing:-.01em}
.kpi .delta{font-size:11.5px;color:var(--success);margin-top:3px;font-weight:500}
.kpi .delta.flat{color:var(--text-soft)}

.kpistrip{display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-16);box-shadow:var(--shadow-xs);margin-bottom:16px;overflow:hidden}
.kpistrip-cell{padding:16px 10px;text-align:center;border-left:1px solid var(--stroke-soft)}
.kpistrip-cell:first-child{border-left:0}
.kpistrip-cell .lbl{font-size:11.5px;color:var(--text-soft);margin-bottom:7px}
.kpistrip-cell .val{font-size:20px;font-weight:600;letter-spacing:-.01em}
.kpistrip-cell .note{font-size:10.5px;color:var(--error-dark);font-weight:600;margin-top:3px}

/* Внешние клиенты — header card actions, export/date popovers */
.ext-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0}
.popwrap{position:relative}
.dropmenu{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-10);box-shadow:var(--shadow-pop);min-width:180px;padding:5px;z-index:30}
.dropmenu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;background:none;border-radius:var(--radius-8);font-size:12.5px;font-weight:500;color:var(--text-strong);cursor:pointer;text-align:left}
.dropmenu button:hover{background:var(--bg-weak)}

.datepop{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-16);box-shadow:var(--shadow-pop);z-index:30;display:flex;overflow:hidden;width:560px}
.datepop-quick{width:130px;flex:0 0 130px;border-right:1px solid var(--stroke-soft);padding:10px;display:flex;flex-direction:column;gap:1px}
.datepop-quick button{border:0;background:none;text-align:left;padding:8px 9px;border-radius:var(--radius-8);font-size:12.5px;color:var(--text-sub);cursor:pointer}
.datepop-quick button:hover{background:var(--bg-weak);color:var(--text-strong)}
.datepop-main{flex:1;padding:14px 16px 0;display:flex;flex-direction:column}
.datepop-months{display:flex;gap:18px}
.cal{flex:1}
.cal-head{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:8px}
.cal-nav{width:22px;height:22px;border-radius:var(--radius-6);border:0;background:none;color:var(--text-sub);cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-nav:hover{background:var(--bg-weak)}
.cal-nav.ph{visibility:hidden}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.cal-dow{font-size:10px;color:var(--text-soft);font-weight:600;padding:4px 0}
.cal-day{font-size:12px;padding:6px 0;border-radius:var(--radius-6);cursor:pointer;color:var(--text-strong)}
.cal-day:hover{background:var(--bg-weak)}
.cal-day.out{color:var(--text-disabled);cursor:default}
.cal-day.out:hover{background:none}
.cal-day.in-range{background:var(--primary-a10);border-radius:0}
.cal-day.range-start{background:var(--primary);color:#fff;border-radius:var(--radius-6) 0 0 var(--radius-6)}
.cal-day.range-end{background:var(--primary);color:#fff;border-radius:0 var(--radius-6) var(--radius-6) 0}
.cal-day.range-only{background:var(--primary);color:#fff;border-radius:var(--radius-6)}
.datepop-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--stroke-soft);padding:11px 16px;margin-top:12px;font-size:12px;color:var(--text-sub)}

.tbl-toprow{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--stroke-soft)}
.tbl-toprow .cnt{font-size:12.5px;color:var(--text-sub);font-weight:500}

/* partner-creation wizard stepper */
.wiz-stepper{display:flex;align-items:flex-start;margin-bottom:18px}
.wiz-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto}
.wiz-num{width:26px;height:26px;flex:0 0 26px;border-radius:99px;border:1.5px solid var(--stroke-med);color:var(--text-soft);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;background:var(--bg-white)}
.wiz-label{font-size:11px;color:var(--text-soft);white-space:nowrap;text-align:center}
.wiz-line{flex:1 1 auto;height:1.5px;background:var(--stroke-soft);margin:12px 6px 0}
.wiz-step.active .wiz-num{border-color:var(--primary);color:var(--primary);background:var(--info-bg)}
.wiz-step.active .wiz-label{color:var(--text-strong);font-weight:600}
.wiz-step.done .wiz-num{border-color:var(--primary);background:var(--primary);color:#fff}
.wiz-step.done .wiz-label{color:var(--text-sub)}

/* error-export period cards */
.errexport-list{display:flex;flex-direction:column}
.errexport-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--stroke-soft);flex-wrap:wrap}
.errexport-item:last-child{border-bottom:0;padding-bottom:0}
.errexport-item:first-child{padding-top:0}
.errexport-label{font-size:12.5px;color:var(--text-strong);flex:1;min-width:0}
.daterange-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 10px;border:1px solid var(--stroke-med);border-radius:var(--radius-8);background:var(--bg-white);font-size:11.5px;color:var(--text-sub);white-space:nowrap;flex:0 0 auto}
.daterange-chip svg{color:var(--text-soft);flex:0 0 auto}
.daterange-chip .chip-x{border:none;background:transparent;cursor:pointer;color:var(--text-soft);font-size:10px;line-height:1;padding:5px;border-radius:var(--radius-6);display:inline-flex}
.daterange-chip .chip-x:hover{background:var(--bg-weak);color:var(--text-sub)}

/* filter pill-button + dropdown (matches bb2 "Статус: Все ▾" component) */
.fbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border:1px solid var(--stroke-med);border-radius:var(--radius-10);background:var(--bg-white);box-shadow:var(--shadow-xs);cursor:pointer;font-size:12.5px;white-space:nowrap}
.fbtn:hover{border-color:#d4d4d4}
.fbtn .flabel{color:var(--text-soft)}
.fbtn .fval{color:var(--text-strong);font-weight:500}
.fbtn .fchev{color:var(--text-soft);flex:0 0 8px}
.fmenu{position:absolute;top:calc(100% + 6px);left:0;background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-10);box-shadow:var(--shadow-pop);min-width:190px;max-height:280px;overflow-y:auto;padding:5px;z-index:30}
.fmenu button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:7px 9px;border:0;background:none;border-radius:var(--radius-8);font-size:12.5px;color:var(--text-strong);cursor:pointer;text-align:left}
.fmenu button:hover{background:var(--bg-weak)}
.fmenu button.sel{color:var(--primary);font-weight:600}

.panel{background:var(--bg-white);border:1px solid var(--stroke-soft);border-radius:var(--radius-12);box-shadow:var(--shadow-xs)}
.panel + .panel{margin-top:14px}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--stroke-soft)}
.panel-h h3{font-size:13.5px;font-weight:600;margin:0}
.panel-h .hint{font-size:11.5px;color:var(--text-soft);margin-top:1px}
.panel-b{padding:16px}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.search{
  display:flex;align-items:center;gap:7px;border:1px solid var(--stroke-med);border-radius:var(--radius-10);
  background:var(--bg-white);padding:7px 11px;min-width:230px;box-shadow:var(--shadow-xs);flex:1;max-width:340px;
}
.search svg{color:var(--text-soft);flex:0 0 14px}
.search input{border:0;outline:0;background:none;width:100%;font-size:12.5px}
.select{
  border:1px solid var(--stroke-med);border-radius:var(--radius-10);background:var(--bg-white);
  padding:7px 28px 7px 11px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow-xs);cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6'><path d='M1 1l3.5 3.5L8 1' stroke='%235c5c5c' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;
}
.chipbtns{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{
  border:1px solid var(--stroke-med);background:var(--bg-white);border-radius:var(--radius-full);
  padding:6px 12px;font-size:12px;font-weight:500;color:var(--text-sub);cursor:pointer;white-space:nowrap;
}
.chipbtn:hover{background:var(--bg-weak)}
.chipbtn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.clearbtn{font-size:12px;color:var(--text-soft);text-decoration:underline;cursor:pointer;background:none;border:0;padding:6px 4px}
.clearbtn:hover{color:var(--text-strong)}
.checkfilter{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sub);cursor:pointer;padding:0 4px}

.twrap{overflow-x:auto;border-radius:var(--radius-12)}
table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
table.grid thead th{
  text-align:left;font-size:10.5px;font-weight:600;color:var(--text-soft);text-transform:uppercase;letter-spacing:.03em;
  padding:9px 14px;border-bottom:1px solid var(--stroke-soft);white-space:nowrap;background:var(--bg-white);
}
table.grid tbody td{padding:11px 14px;border-bottom:1px solid var(--stroke-soft);vertical-align:middle;white-space:nowrap}
table.grid tbody tr{cursor:pointer;transition:background .1s}
table.grid tbody tr:hover{background:var(--bg-weak)}
table.grid tbody tr:last-child td{border-bottom:0}
.cell-strong{font-weight:500;color:var(--text-strong)}
.cell-sub{font-size:11.5px;color:var(--text-soft);margin-top:1px}
.mono{font-family:var(--font-mono);font-size:11.5px;color:var(--text-sub)}
.empty-state{padding:50px 20px;text-align:center;color:var(--text-soft)}
.empty-state .big{font-size:13px;font-weight:500;color:var(--text-sub);margin-bottom:4px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--radius-full);font-size:11px;font-weight:600;white-space:nowrap}
.badge .d{width:6px;height:6px;border-radius:99px}
.b-success{background:var(--success-bg);color:var(--success-dark)}
.b-success .d{background:var(--success)}
.b-warning{background:var(--warning-bg);color:var(--warning-dark)}
.b-warning .d{background:var(--warning)}
.b-error{background:var(--error-bg);color:var(--error-dark)}
.b-error .d{background:var(--error)}
.b-info{background:var(--info-bg);color:var(--primary)}
.b-info .d{background:var(--primary)}
.b-faded{background:var(--faded-bg);color:var(--faded)}
.b-faded .d{background:var(--faded)}
.tag{display:inline-flex;padding:2.5px 8px;border-radius:var(--radius-6);font-size:11px;font-weight:500;background:var(--bg-soft);color:var(--text-sub)}

.backlink{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-sub);cursor:pointer;margin-bottom:12px;font-weight:500}
.backlink:hover{color:var(--primary)}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.detail-title{display:flex;align-items:center;gap:12px}
.avatar-lg{width:44px;height:44px;border-radius:var(--radius-full);background:linear-gradient(135deg,var(--purple-700),var(--purple-400));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex:0 0 44px}
.detail-title h1{margin:0;font-size:18px;font-weight:600}
.metarow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.detail-title .metarow{margin-top:5px}
.idline{font-size:11.5px;color:var(--text-soft)}
.detail-title .idline{margin-top:4px;display:block}

/* Аккаунт — общая шапка карточки (одна и та же для физлиц и партнёров) */
.rec-card{background:transparent;padding:0;margin-bottom:16px}
.rec-top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.rec-back{width:44px;height:44px;border-radius:var(--radius-10);border:1px solid var(--stroke-soft);background:var(--bg-white);display:flex;align-items:center;justify-content:center;color:var(--primary);cursor:pointer;flex:0 0 44px;text-decoration:none}
.rec-back:hover{background:var(--bg-weak)}
.rec-headrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rec-headrow h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.005em}
.rec-pill{display:inline-flex;padding:3px 11px;border-radius:var(--radius-full);font-size:11.5px;font-weight:600}
.btn-solid-danger{background:var(--error);border-color:var(--error);color:#fff}
.btn-solid-danger:hover{background:#e0212f;border-color:#e0212f}
.rec-meta{display:flex;align-items:center;gap:16px;margin-top:8px;font-size:12px;color:var(--text-soft);flex-wrap:wrap}
.rec-meta .idcopy{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-family:var(--font-mono)}
.rec-meta .idcopy:hover{color:var(--text-sub)}
.rec-meta .idcopy svg{opacity:.6;flex:0 0 12px}

.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
@media (max-width:1050px){.grid2{grid-template-columns:1fr}}

.deflist{display:grid;grid-template-columns:repeat(2,1fr);gap:13px 20px}
.deflist.cols3{grid-template-columns:repeat(3,1fr)}
.deflist.cols4{grid-template-columns:repeat(4,1fr)}
.kyc-preview-wrap{position:relative;max-height:560px;overflow:hidden}
.kyc-preview-wrap::after{content:'';position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(to bottom, transparent, var(--bg-app) 78%);pointer-events:none}
.deflist dt{font-size:11px;color:var(--text-soft);font-weight:500;text-transform:uppercase;letter-spacing:.02em;margin-bottom:3px}
.deflist dd{margin:0;font-size:13px;font-weight:500;color:var(--text-strong)}
.deflist dd.muted{color:var(--text-soft);font-weight:400}
.muted{color:var(--text-soft)}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--stroke-soft)}
.toggle-row:last-child{border-bottom:0}
.toggle-row .tt{font-size:13px;font-weight:500}
.ts{font-size:11.5px;color:var(--text-soft)}
.toggle-row .ts{margin-top:2px}
.switch{position:relative;width:36px;height:21px;flex:0 0 36px;border-radius:99px;background:var(--stroke-med);cursor:pointer;transition:background .15s;border:0;padding:0}
.switch.on{background:var(--primary)}
.switch .knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:99px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch.on .knob{left:17px}
.switch[disabled]{opacity:.5;cursor:not-allowed}
.pin{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--text-soft);background:var(--bg-soft);padding:2px 6px;border-radius:99px}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:500;color:var(--text-sub)}
.field input,.field select,.field textarea{
  border:1px solid var(--stroke-med);border-radius:var(--radius-8);padding:8px 10px;font-size:12.5px;
  background:var(--bg-white);width:100%;outline:0;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-a10)}
.field .req{color:var(--error)}
.field small{font-size:11px;color:var(--text-soft)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-grid.cols3{grid-template-columns:1fr 1fr 1fr}
.hairline{border:0;border-top:1px solid var(--stroke-soft);margin:16px 0}

.secretbox{display:flex;align-items:center;gap:8px;background:var(--bg-weak);border:1px solid var(--stroke-soft);border-radius:var(--radius-8);padding:9px 11px}
.secretbox .val{flex:1;font-family:var(--font-mono);font-size:12px;color:var(--text-sub);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.actionsbar{display:flex;gap:8px;flex-wrap:wrap}

.doclist{display:flex;flex-direction:column;gap:1px}
.docrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--stroke-soft)}
.docrow:last-child{border-bottom:0}
.doc-thumb{width:34px;height:34px;flex:0 0 34px;border-radius:var(--radius-8);background:var(--bg-weak);border:1px solid var(--stroke-soft);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer}
.doc-thumb:hover{background:var(--bg-soft)}
.doc-name{flex:1;font-size:12.5px;font-weight:500;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-name:hover{color:var(--primary)}
.icon-btn{width:30px;height:30px;flex:0 0 30px;border-radius:var(--radius-8);border:1px solid var(--stroke-med);background:var(--bg-white);color:var(--text-sub);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:var(--bg-weak);color:var(--text-strong)}
.icon-btn.danger:hover{background:var(--error-bg);color:var(--error-dark);border-color:#ffd0d4}
.doc-preview-box{width:100%;aspect-ratio:3/4;background:var(--bg-weak);border:1px solid var(--stroke-soft);border-radius:var(--radius-12);display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--text-soft)}

.checklist{display:flex;flex-direction:column}
.checkrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--stroke-soft)}
.checkrow:last-child{border-bottom:0}
.checkrow .nm{font-size:12.5px;font-weight:500;flex:1;min-width:0}
.checkrow .nm .sub{font-size:11px;font-weight:400;color:var(--text-soft);margin-top:1px}

.logrow{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:10px 4px;border-bottom:1px solid var(--stroke-soft);font-size:12px}
.logrow:last-child{border-bottom:0}
.logrow .when{color:var(--text-soft);font-size:11px}
.logrow .field-name{font-weight:500}
.logrow .diff{color:var(--text-sub);margin-top:2px}
.logrow .diff .old{color:var(--error-dark);text-decoration:line-through;opacity:.7}
.logrow .diff .new{color:var(--success-dark);font-weight:500}
.logrow .reason{color:var(--text-soft);font-size:11.5px;margin-top:2px;font-style:italic}
.logrow .actor{font-size:11px;color:var(--text-soft);margin-top:3px}

.delnote{background:var(--warning-bg);border:1px solid #ffe0c2;border-radius:var(--radius-10);padding:11px 13px;font-size:12.5px;color:var(--warning-dark);margin-bottom:12px}

.placeholder-card{padding:60px 20px;text-align:center;color:var(--text-soft);border:1px dashed var(--stroke-med);border-radius:var(--radius-12);background:var(--bg-white)}
.placeholder-card b{color:var(--text-sub);display:block;margin-bottom:4px;font-size:13px}

.overlay{position:fixed;inset:0;background:rgba(23,23,23,.42);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--bg-white);border-radius:var(--radius-16);box-shadow:var(--shadow-pop);width:100%;max-width:480px;overflow:hidden}
.modal.wide{max-width:640px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--stroke-soft)}
.modal-h h3{margin:0;font-size:14.5px;font-weight:600}
.modal-x{width:26px;height:26px;border-radius:var(--radius-8);border:0;background:none;color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--bg-weak);color:var(--text-strong)}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:13px;max-height:64vh;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--stroke-soft)}
.section-num{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text-soft);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 0}
.section-num .n{width:18px;height:18px;border-radius:99px;background:var(--primary-a14);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:10.5px}

.jsonbox{background:#171717;color:#d9d9e3;border-radius:var(--radius-10);padding:12px 13px;font-family:var(--font-mono);font-size:11.5px;line-height:1.6;overflow-x:auto;white-space:pre}

.toast-wrap{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:80}

.loading-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:100px 20px;color:var(--text-sub)}
.spinner{width:34px;height:34px;border-radius:99px;border:3px solid var(--stroke-soft);border-top-color:var(--primary);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-stage .lt{font-size:13px;font-weight:500}
.loading-stage .ls{font-size:12px;color:var(--text-soft)}
.toast{background:var(--text-strong);color:#fff;padding:10px 15px;border-radius:var(--radius-10);font-size:12.5px;font-weight:500;box-shadow:var(--shadow-pop);opacity:0;transform:translateY(6px);transition:all .18s}
.toast.show{opacity:1;transform:translateY(0)}

.helper-note{font-size:11.5px;color:var(--text-soft);background:var(--bg-weak);border-radius:var(--radius-8);padding:8px 10px;display:flex;gap:7px;align-items:flex-start}
.helper-note b{color:var(--text-sub)}
</style>
</head>
<body>

<div class="shell">
  <!-- ============ SIDEBAR — matches the real bb2 sidebar screenshot 1:1; inert except Аккаунты / Внешние клиенты ============ -->
  <aside class="side">

      </span>

          </button>

        <button class="side-item">
          <span class="ic">{{ICON_BAR}}</span><span class="lbl">Аналитика</span><span class="chev">{{ICON_CHEV_R}}</span>
        </button>
      </div>

      <div class="side-group-label">Финансовые продукты</div>
      <div class="side-group">
        <button class="side-item"><span class="ic">{{ICON_DOC}}</span><span class="lbl">ОПС / PSP</span><span class="chev">{{ICON_CHEV_R}}</span></button>
        <button class="side-item"><span class="ic">{{ICON_VAULT}}</span><span class="lbl">Депозитарий</span><span class="chev">{{ICON_CHEV_R}}</span></button>
        <button class="side-item"><span class="ic">{{ICON_TREND}}</span><span class="lbl">Биржа</span><span class="chev">{{ICON_CHEV_R}}</span></button>
        <button class="side-item"><span class="ic">{{ICON_COIN}}</span><span class="lbl">Криптоброкер</span><span class="chev">{{ICON_CHEV_R}}</span></button>
      </div>

      <div class="side-group-label">Управление платформой</div>
      <div class="side-group">
        <button class="side-item"><span class="ic">{{ICON_GEAR}}</span><span class="lbl">Настройки</span><span class="chev">{{ICON_CHEV_R}}</span></button>
      </div>
    </nav>
    <div class="side-foot">
      <div class="side-collapse">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Свернуть
      </div>
    </div>
  </aside>

  <div class="main">
    <!-- ============ TOPBAR — matches the real bb2 topbar screenshot; inert ============ -->
    <div class="topbar">
      <div class="lang-pill">
        <span class="flag">🇷🇺</span> Русский
        <svg class="chev" width="9" height="9" viewBox="0 0 9 6" fill="none"><path d="M1 5l3.5-3.5L8 5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
      </div>
      <div class="topbar-divider"></div>
      <div class="top-profile">
        <div class="av">SA<span class="dot"></span></div>
        <div class="who">
          <div class="n">Super Admin</div>
          <div class="e">super-admin@admin.com</div>
        </div>
      </div>
      <div class="top-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <div class="stage" id="stage"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* =========================================================================
   ICONS — simple outline set, injected into the sidebar placeholders above
   ========================================================================= */
const ICONS = {
  ICON_GRID: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>',

  ICON_PERSON: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  ICON_FOLDER: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  ICON_CARD: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="5" width="19" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 10h19" stroke="currentColor" stroke-width="1.6"/></svg>',
  ICON_DOC: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 2.5h9l4.5 4.5V20a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 20V4A1.5 1.5 0 0 1 6 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.5 12h7M8.5 16h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',

/* ---------- date helpers (для попапа периода) ---------- */
function d0(y,m,day){ return new Date(y,m,day); }
function sameDay(a,b){ return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function fmtRu(dt){ return dt ? dt.toLocaleDateString('ru-RU') : ''; }
function addDays(dt,n){ const d=new Date(dt); d.setDate(d.getDate()+n); return d; }
const MONTH_NAMES_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DOW_RU = ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];

function monthMatrix(year, month){
  const first = d0(year, month, 1);
  const startOffset = (first.getDay()+6)%7; // Monday=0
  const gridStart = addDays(first, -startOffset);
  const days = [];
  for(let i=0;i<42;i++) days.push(addDays(gridStart, i));
  return days;
}

function quickRanges(){
  const today = new Date(); today.setHours(0,0,0,0);
  const y=today.getFullYear(), m=today.getMonth();
  return {
    'Сегодня': [today, today],
    'Вчера': [addDays(today,-1), addDays(today,-1)],
    'Неделя': [addDays(today,-6), today],
    'Месяц': [addDays(today,-29), today],
    'Квартал': [addDays(today,-89), today],
    'Год': [addDays(today,-364), today],
    'Прошлый месяц': [d0(y,m-1,1), d0(y,m,0)],
  };
}

function kycStatusPill(s){
  const map = { PROCESSING:['b-info','PROCESSING'], SUCCESSFUL:['b-success','SUCCESSFUL'], NONE:['b-faded','NONE'] };

const KYC_LEVELS = ['Level 1','Level 2','Level 3'];
/** Партнёр — тоже аккаунт в едином реестре, но своего личного KYC-уровня/статуса
 *  прототип отдельно не мокает — выводим по его агентскому статусу для наглядности в списке. */
function agentKycMock(a){
  const map = {
    ACTIVE:{level:'Level 2', status:'SUCCESSFUL'},
    SUSPENDED:{level:'Level 2', status:'SUCCESSFUL'},
    ARCHIVED:{level:'Level 1', status:'SUCCESSFUL'},
    EXPIRED:{level:'Level 1', status:'PROCESSING'},
    INVITED:{level:'—', status:'NONE'},
  };
  return map[a.status] || {level:'—', status:'NONE'};
}
/** Единый формат ID по всему реестру — u-XXXXXXXX (как у партнёрского userId). */
function shortUid(fullId){
  return 'u-' + String(fullId||'').replace(/-/g,'').slice(0,8);
}
/** Мок агрегированного баланса — детерминирован по id, чтобы не прыгал между рендерами. */
function mockBalance(seed){
  let h=0; for(let i=0;i<String(seed).length;i++){ h = (h*31 + String(seed).charCodeAt(i)) >>> 0; }
  if(h % 6 === 0) return '—';
  const cur = h % 3 === 0 ? 'USDT' : 'RUB';
  const amount = (h % 48000) + 300;
  return `${amount.toLocaleString('ru-RU')} ${cur}`;
}
/** "19.08.26" → Date (для сравнения с фильтром по дате). */
function parseRuShortDate(s){
  const m = /^(\d{2})\.(\d{2})\.(\d{2})$/.exec(String(s||'').trim());
  if(!m) return null;
  return new Date(2000+Number(m[3]), Number(m[2])-1, Number(m[1]));
}
function inFilterDateRange(dateStr, fromDate, toDate){
  if(!fromDate && !toDate) return true;
  const d = parseRuShortDate(dateStr);
  if(!d) return true;
  if(fromDate && d < fromDate) return false;
  if(toDate){ const to = new Date(toDate); to.setHours(23,59,59,999); if(d > to) return false; }
  return true;
}

    $('#individualKycStatusFilterBtn')?.addEventListener('click', ()=>{
      state.openFilterMenu = state.openFilterMenu==='individualKycStatus' ? null : 'individualKycStatus'; render();
    });
    $all('[data-individualkycstatus-opt]').forEach(b=>b.addEventListener('click', ()=>{
      state.filters.individualKycStatus=b.dataset.individualkycstatusOpt; state.openFilterMenu=null; render();
    }));
    $('#individualKycLevelFilterBtn')?.addEventListener('click', ()=>{
      state.openFilterMenu = state.openFilterMenu==='individualKycLevel' ? null : 'individualKycLevel'; render();
    });
    $all('[data-individualkyclevel-opt]').forEach(b=>b.addEventListener('click', ()=>{
      state.filters.individualKycLevel=b.dataset.individualkyclevelOpt; state.openFilterMenu=null; render();
    }));
    $('#individualDateRangeBtn')?.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!(state.dateUI.open && state.dateUI.target==='individual')){
        state.dateUI.target = 'individual';
        state.dateUI.viewMonth = state.filters.individualCreatedFrom || new Date();
        state.dateUI.tempFrom = state.filters.individualCreatedFrom; state.dateUI.tempTo = state.filters.individualCreatedTo;
        state.dateUI.open = true;
      } else {
        state.dateUI.open = false;
      }
      state.openFilterMenu=null; render();
    });
    $all('[data-calnav]').forEach(b=>b.addEventListener('click', ()=>{
      const dir = b.dataset.calnav==='prev' ? -1 : 1;
      const v = state.dateUI.viewMonth || new Date();
      state.dateUI.viewMonth = new Date(v.getFullYear(), v.getMonth()+dir, 1);
      render();
    }));
    $all('[data-day]').forEach(cell=>cell.addEventListener('click', ()=>{
      const [yy,mm,dd] = cell.dataset.day.split('-').map(Number);
      const picked = d0(yy,mm,dd);
      const u = state.dateUI;
      if(!u.tempFrom || (u.tempFrom && u.tempTo)){ u.tempFrom = picked; u.tempTo = null; }
      else { if(picked < u.tempFrom){ u.tempTo = u.tempFrom; u.tempFrom = picked; } else { u.tempTo = picked; } }
      render();
    }));
    $all('[data-quick]').forEach(b=>b.addEventListener('click', ()=>{
      const [from,to] = quickRanges()[b.dataset.quick];
      state.dateUI.tempFrom = from; state.dateUI.tempTo = to; state.dateUI.viewMonth = from;
      render();
    }));
    $('#dateReset')?.addEventListener('click', ()=>{
      state.filters.individualCreatedFrom=null; state.filters.individualCreatedTo=null; state.dateUI.open=false; render();
    });
    $('#dateApply')?.addEventListener('click', ()=>{
      state.filters.individualCreatedFrom = state.dateUI.tempFrom; state.filters.individualCreatedTo = state.dateUI.tempTo;
      state.dateUI.open=false; render();
    });
    $('#individualClear')?.addEventListener('click', ()=>{
      state.filters.individualQuery=''; state.filters.individualKycStatus=''; state.filters.individualKycLevel='';
      state.filters.individualCreatedFrom=null; state.filters.individualCreatedTo=null; render();
    });
    $all('[data-individual-link]').forEach(l=>l.addEventListener('click', (e)=>{
      e.preventDefault(); e.stopPropagation();
      state.currentIndividualId=e.currentTarget.dataset.individualLink; state.individualTab='kyc'; state.view='individual-detail'; render();
    }));
    return;
  }

  $('#agentSearch')?.addEventListener('input', e=>{ state.filters.agentQuery=e.target.value; renderInto(); });
  $('#agentKycStatusFilterBtn')?.addEventListener('click', ()=>{
    state.openFilterMenu = state.openFilterMenu==='agentKycStatus' ? null : 'agentKycStatus'; render();
  });
  $all('[data-agentkycstatus-opt]').forEach(b=>b.addEventListener('click', ()=>{
    state.filters.agentKycStatus=b.dataset.agentkycstatusOpt; state.openFilterMenu=null; render();
  }));
  $('#agentKycLevelFilterBtn')?.addEventListener('click', ()=>{
    state.openFilterMenu = state.openFilterMenu==='agentKycLevel' ? null : 'agentKycLevel'; render();
  });
  $all('[data-agentkyclevel-opt]').forEach(b=>b.addEventListener('click', ()=>{
    state.filters.agentKycLevel=b.dataset.agentkyclevelOpt; state.openFilterMenu=null; render();
  }));
  $('#agentClear')?.addEventListener('click', ()=>{
    state.filters.agentQuery=''; state.filters.agentKycStatus=''; state.filters.agentKycLevel=''; render();
  });
  $all('[data-agent-link]').forEach(l=>l.addEventListener('click', (e)=>{
    e.preventDefault(); e.stopPropagation();
    state.currentAgentId=e.currentTarget.dataset.agentLink; state.accountDetailTab='kyc'; state.view='account-detail'; render();
  }));
}

function renderInto(){
  const activeEl = document.activeElement;
  const isSearch = activeEl && (activeEl.id==='agentSearch' || activeEl.id==='clientSearch' || activeEl.id==='individualSearch');
  const caret = isSearch ? activeEl.selectionStart : null;
  render();
  if(isSearch){ const el=$('#'+activeEl.id); if(el){ el.focus(); el.setSelectionRange(caret,caret); } }
}

  });
  $('#btnShowSecret')?.addEventListener('click', (e)=>{

    else { val.textContent = '••••••••••••••••••••••••••••••••'; e.target.textContent='Показать'; }
  });
  $('#btnRegenSecret')?.addEventListener('click', ()=>{
    openConfirmModal({ title:'Перевыпустить HMAC-секрет?', body:'Старый секрет перестанет работать немедленно. Партнёру нужно будет обновить интеграцию.', confirmLabel:'Перевыпустить', danger:true,
      onConfirm:()=>{ a.secret = 'mock_sk_' + Math.random().toString(16).slice(2,18)+Math.random().toString(16).slice(2,18);
        $('#secretVal').textContent = '••••••••••••••••••••••••••••••••'; $('#btnShowSecret').textContent='Показать'; toast('Секрет перевыпущен'); }});
  });
  $('#btnEditCommission')?.addEventListener('click', ()=>openCommissionModal(a));
  $('#marketFeesLink')?.addEventListener('click', (e)=>{ e.preventDefault(); toast('Раздел «Настройки → Маркеты → Комиссии» — вне рамок текущего прототипа'); });
  $('#btnEditPartnerInfo')?.addEventListener('click', ()=>openEditPartnerInfoModal(a));
  $('#btnExportBillable')?.addEventListener('click', ()=>toast('Нет данных для экспорта за выбранный период'));
  $('#btnExportKycUsage')?.addEventListener('click', ()=>{
    const rows = KYC_USAGE_LOG[a.id]||[];

  });
  $all('[data-errdownload]').forEach(b=>b.addEventListener('click', ()=>{
    const labels = {kyc:'ошибок KYC', sbp:'ошибок API СБП', users:'ошибок по пользователям'};
    toast('Формируется выгрузка '+labels[b.dataset.errdownload]+' за период…');
  }));
  $all('[data-errclear]').forEach(b=>b.addEventListener('click', ()=>toast('Период сброшен')));

  $('#btnSaveKycBridge')?.addEventListener('click', ()=>{
    $all('input[data-kyc]').forEach(inp=>{ a[inp.dataset.kyc] = inp.value; });
    const bridgeModeSelect = $('[data-kyc-select="bridgeMode"]');

    toast('Настройки KYC-моста сохранены');
  });

  $('#btnSaveTelegram')?.addEventListener('click', ()=>{

    a.autoWithdrawWallet = $('#awWallet').value;
    a.autoWithdrawLower = $('#awLower').value;
    a.autoWithdrawUpper = $('#awUpper').value;
    toast('Настройки автовывода сохранены');
  });

  bindClientsTableRows();

const PARTNER_WIZARD_STEPS = ['Наименование', 'Лимиты', 'Тумблеры'];

function openMakePartnerModal(r){
  const wiz = {
    step: 1,
    partnerName: '',
    minQrAmount:'', maxQrAmount:'', rollingPeriodDays:'30', createdQrDailyLimit:'', successfulQrDailyLimit:'', unpaidQrBanLimit:'', rollingAmountLimit:'',
    canSbp:true, canQr:true, acceptForeignClients:false,
  };
  renderPartnerWizardStep(r, wiz);
}

function renderPartnerWizardStep(r, wiz){
  const stepperHtml = PARTNER_WIZARD_STEPS.map((label,i)=>{
    const n = i+1;
    const cls = n<wiz.step ? 'done' : n===wiz.step ? 'active' : '';
    return `<div class="wiz-step ${cls}"><span class="wiz-num">${n<wiz.step?'✓':n}</span><span class="wiz-label">${label}</span></div>`;
  }).join('<div class="wiz-line"></div>');

  let bodyHtml = '';
  if(wiz.step===1){
    bodyHtml = `
      <div style="font-size:13px;color:var(--text-sub);margin-bottom:12px">Пользователь будет отмечен как партнёр. Название партнёра — обязательное поле, без него включить партнёрский статус нельзя.</div>
      <div class="field"><label>Название партнёра <span class="req">*</span></label><input id="wizName" value="${esc(wiz.partnerName)}" placeholder="${esc(r.name==='—'?r.email:r.name)}"></div>
    `;
  } else if(wiz.step===2){
    bodyHtml = `
      <div style="font-size:13px;color:var(--text-sub);margin-bottom:12px">Лимиты СБП-пополнения для партнёра. Можно оставить пустыми и настроить позже в карточке партнёра.</div>
      <div class="field-grid cols3">
        <div class="field"><label>Мин. сумма QR</label><input id="wizMinQr" value="${esc(wiz.minQrAmount)}" placeholder="—"></div>
        <div class="field"><label>Макс. сумма QR</label><input id="wizMaxQr" value="${esc(wiz.maxQrAmount)}" placeholder="—"></div>
        <div class="field"><label>Скользящий период, дн.</label><input id="wizRollDays" value="${esc(wiz.rollingPeriodDays)}" placeholder="30"></div>
        <div class="field"><label>Создано QR в сутки</label><input id="wizCreatedDaily" value="${esc(wiz.createdQrDailyLimit)}" placeholder="—"></div>
        <div class="field"><label>Оплачено QR в сутки</label><input id="wizSuccessDaily" value="${esc(wiz.successfulQrDailyLimit)}" placeholder="—"></div>
        <div class="field"><label>Лимит неоплаченных до блокировки</label><input id="wizUnpaidBan" value="${esc(wiz.unpaidQrBanLimit)}" placeholder="—"></div>
      </div>
      <div class="field" style="margin-top:12px;max-width:260px"><label>Сумма за скользящий период</label><input id="wizRollAmount" value="${esc(wiz.rollingAmountLimit)}" placeholder="—"></div>
    `;
  } else {
    bodyHtml = `
      <div style="font-size:13px;color:var(--text-sub);margin-bottom:4px">Разрешения партнёра — можно изменить позже в карточке.</div>
      <div class="toggle-row">
        <div><div class="tt">Допуск к СБП</div><div class="ts">Партнёр сможет принимать пополнения через СБП</div></div>
        <button class="switch ${wiz.canSbp?'on':''}" id="wizCanSbp"><span class="knob"></span></button>
      </div>
      <div class="toggle-row">
        <div><div class="tt">Допуск к QR</div><div class="ts">Партнёр сможет принимать пополнения по QR</div></div>
        <button class="switch ${wiz.canQr?'on':''}" id="wizCanQr"><span class="knob"></span></button>
      </div>
      <div class="toggle-row" style="border-bottom:0">
        <div><div class="tt">Приём иностранных клиентов</div><div class="ts">Разрешает создавать клиентов с иностранным паспортом</div></div>
        <button class="switch ${wiz.acceptForeignClients?'on':''}" id="wizForeign"><span class="knob"></span></button>
      </div>
    `;
  }

  const backBtn = wiz.step>1 ? `<button class="btn" id="wizBack">Назад</button>` : `<button class="btn" data-close-modal>Отмена</button>`;
  const nextLabel = wiz.step<3 ? 'Далее' : 'Создать партнёра';

  openModal(`
    <div class="modal-h"><h3>Сделать партнёром — шаг ${wiz.step} из 3</h3><button class="modal-x" data-close-modal>✕</button></div>
    <div class="modal-b">
      <div class="wiz-stepper">${stepperHtml}</div>
      ${bodyHtml}
    </div>
    <div class="modal-f">${backBtn}<button class="btn btn-primary" id="wizNext">${nextLabel}</button></div>
  `);

  if(wiz.step>1) $('#wizBack').addEventListener('click', ()=>{ wiz.step--; renderPartnerWizardStep(r, wiz); });

  if(wiz.step===3){
    $('#wizCanSbp').addEventListener('click', e=>{ wiz.canSbp=!wiz.canSbp; e.currentTarget.classList.toggle('on'); });
    $('#wizCanQr').addEventListener('click', e=>{ wiz.canQr=!wiz.canQr; e.currentTarget.classList.toggle('on'); });
    $('#wizForeign').addEventListener('click', e=>{ wiz.acceptForeignClients=!wiz.acceptForeignClients; e.currentTarget.classList.toggle('on'); });
  }

  $('#wizNext').addEventListener('click', ()=>{
    if(wiz.step===1){
      const val = $('#wizName').value.trim();
      if(!val){ toast('Укажите название партнёра'); return; }
      wiz.partnerName = val;
      wiz.step = 2; renderPartnerWizardStep(r, wiz);
    } else if(wiz.step===2){
      wiz.minQrAmount = $('#wizMinQr').value;

function inDateRange(createdAt, from, to){
  if(!from && !to) return true;
  const t = Date.parse((createdAt||'').replace(' ','T'));
  if(isNaN(t)) return false;
  if(from && t < from.getTime()) return false;
  if(to){ const end = new Date(to); end.setHours(23,59,59,999); if(t > end.getTime()) return false; }
  return true;
}

function filteredClients(){
  const f = state.filters;
  return clients.filter(c=>{
    if(f.clientPartner && c.agentId!==f.clientPartner) return false;
    if(f.clientStatus && c.status!==f.clientStatus) return false;
    if(f.clientChannel && c.sourceChannel!==f.clientChannel) return false;
    if(f.clientVerification && c.verificationStatus!==f.clientVerification) return false;
    if(f.onlyToDelete && !c.deletionRequested) return false;
    if(f.clientCheckResult && c.checkResult!==f.clientCheckResult) return false;
    if(f.clientKycMethod && c.kycMethod!==f.clientKycMethod) return false;
    if(f.clientPassportCountry && c.passportIssuingCountry!==f.clientPassportCountry) return false;
    if(!inDateRange(c.createdAt, f.createdFrom, f.createdTo)) return false;
    if(f.clientQuery){
      const q = f.clientQuery.toLowerCase();
      if(![fullName(c), c.email, c.externalId, c.phoneNumber].join(' ').toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

/**
 * Повторяет getExternalClientsKpi() / _buildKpiBaseQuery() из agents-program:
 * externalClients / activePartners / newThisWeek / kycApproved / pendingDeletion,
 * с теми же фильтрами и тем же умолчанием — ARCHIVED и DRAFT не учитываются,
 * если статус не выбран явно. activePartners не зависит от фильтров клиента —
 * это отдельный count() по агентам (countActivePartners).
 */
function computeExternalClientsKpi(){
  const f = state.filters;
  let base = clients.filter(c=>c.externalId);
  if(f.clientPartner) base = base.filter(c=>c.agentId===f.clientPartner);
  if(f.clientStatus) base = base.filter(c=>c.status===f.clientStatus);
  else base = base.filter(c=>c.status!=='ARCHIVED' && c.status!=='DRAFT');
  if(f.clientVerification) base = base.filter(c=>c.verificationStatus===f.clientVerification);
  if(f.clientChannel) base = base.filter(c=>c.sourceChannel===f.clientChannel);
  base = base.filter(c=>inDateRange(c.createdAt, f.createdFrom, f.createdTo));

  const weekAgo = Date.now() - 7*24*60*60*1000;
  const newThisWeek = base.filter(c=>{
    const t = Date.parse((c.createdAt||'').replace(' ','T'));
    return !isNaN(t) && t >= weekAgo;
  }).length;

  const activePartners = f.clientPartner
    ? (agentById(f.clientPartner)?.status==='ACTIVE' ? 1 : 0)
    : agents.filter(a=>a.status==='ACTIVE').length;

  return {
    externalClients: base.length,
    activePartners,
    newThisWeek,
    kycApproved: base.filter(c=>c.verificationStatus==='APPROVED').length,
    pendingDeletion: base.filter(c=>c.deletionRequested).length,
  };
}

  const k = computeExternalClientsKpi();

    ['KYC одобрено', k.kycApproved],
    ['Помечено к удалению', k.pendingDeletion, k.pendingDeletion>0 ? 'требует внимания' : null],

  return `<div class="kpistrip">${cells.map(([lbl,val,note])=>`

}

function renderDatePopover(){
  const today = new Date(); today.setHours(0,0,0,0);
  const view = state.dateUI.viewMonth || today;
  const y = view.getFullYear(), m = view.getMonth();
  const from = state.dateUI.tempFrom, to = state.dateUI.tempTo;

  function renderMonth(yy, mm, showPrev, showNext){
    const days = monthMatrix(yy, mm);
    const cells = days.map(d=>{
      const out = d.getMonth()!==mm;
      let cls = 'cal-day' + (out?' out':'');
      if(!out && from && sameDay(d,from) && to && sameDay(d,to)) cls += ' range-only';
      else if(!out && from && sameDay(d,from) && to) cls += ' range-start';
      else if(!out && to && sameDay(d,to) && from) cls += ' range-end';
      else if(!out && from && sameDay(d,from) && !to) cls += ' range-only';
      else if(!out && from && to && d>from && d<to) cls += ' in-range';
      return `<div class="${cls}" ${out?'':`data-day="${d.getFullYear()}-${d.getMonth()}-${d.getDate()}"`}>${d.getDate()}</div>`;
    }).join('');
    return `
      <div class="cal">
        <div class="cal-head">
          <button class="cal-nav ${showPrev?'':'ph'}" data-calnav="prev">‹</button>
          <span>${MONTH_NAMES_RU[mm]} ${yy}</span>
          <button class="cal-nav ${showNext?'':'ph'}" data-calnav="next">›</button>
        </div>
        <div class="cal-grid">${DOW_RU.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
      </div>`;
  }
  const nextM = m===11?0:m+1, nextY = m===11?y+1:y;

  const quick = quickRanges();
  const quickHtml = Object.keys(quick).map(k=>`<button data-quick="${esc(k)}">${k}</button>`).join('');

  return `
    <div class="datepop">
      <div class="datepop-quick">${quickHtml}</div>
      <div class="datepop-main">
        <div class="datepop-months">
          ${renderMonth(y,m,true,false)}
          ${renderMonth(nextY,nextM,false,true)}
        </div>
        <div class="datepop-foot">
          <span>${from?fmtRu(from):'—'} — ${to?fmtRu(to):'—'}</span>
          <div style="display:flex;gap:8px">
            <button class="btn btn-sm" id="dateReset">Сбросить</button>
            <button class="btn btn-primary btn-sm" id="dateApply">Применить</button>
          </div>
        </div>
      </div>
    </div>`;
}

function bindExternalListPage(){
  $all('.seg-tab[data-exttab]').forEach(t=>t.addEventListener('click', ()=>{ state.externalTab=t.dataset.exttab; render(); }));
  $all('.seg-tab[data-channel]').forEach(b=>b.addEventListener('click', ()=>{ state.filters.clientChannel=b.dataset.channel; render(); }));
  $('#clientSearch')?.addEventListener('input', e=>{ state.filters.clientQuery=e.target.value; renderInto(); });
  $('#onlyToDelete')?.addEventListener('change', e=>{ state.filters.onlyToDelete=e.target.checked; render(); });
  $('#clientClear')?.addEventListener('click', (e)=>{
    e.preventDefault();
    state.filters.clientQuery=''; state.filters.clientStatus=''; state.filters.clientChannel='';
    state.filters.clientVerification=''; state.filters.clientPartner='';
    state.filters.clientCheckResult=''; state.filters.clientKycMethod=''; state.filters.clientPassportCountry='';
    state.filters.createdFrom=null; state.filters.createdTo=null; render();
  });
  $('#btnImportCsv')?.addEventListener('click', ()=>openImportCsvModal(state.filters.clientPartner||null));
  $('#btnAddClientGlobal')?.addEventListener('click', ()=>openNewClientModal(state.filters.clientPartner||null));
  bindClientsTableRows();

  /* filter pill dropdowns: Партнёр / Статус / Верификация */
  $all('.popwrap').forEach(w=>w.addEventListener('click', e=>e.stopPropagation()));
  const toggleMenu = (key)=>{ state.openFilterMenu = state.openFilterMenu===key ? null : key; state.exportOpen=false; state.dateUI.open=false; render(); };
  $('#partnerFilterBtn')?.addEventListener('click', ()=>toggleMenu('partner'));
  $('#statusFilterBtn')?.addEventListener('click', ()=>toggleMenu('status'));
  $('#verifFilterBtn')?.addEventListener('click', ()=>toggleMenu('verif'));
  $('#checkResultFilterBtn')?.addEventListener('click', ()=>toggleMenu('checkResult'));
  $('#kycMethodFilterBtn')?.addEventListener('click', ()=>toggleMenu('kycMethod'));
  $('#passportCountryFilterBtn')?.addEventListener('click', ()=>toggleMenu('passportCountry'));
  $all('[data-partner-opt]').forEach(b=>b.addEventListener('click', ()=>{ state.filters.clientPartner=b.dataset.partnerOpt; state.openFilterMenu=null; render(); }));
  $all('[data-status-opt]').forEach(b=>b.addEventListener('click', ()=>{ state.filters.clientStatus=b.dataset.statusOpt; state.openFilterMenu=null; render(); }));
  $all('[data-verif-opt]').forEach(b=>b.addEventListener('click', ()=>{ state.filters.clientVerification=b.dataset.verifOpt; state.openFilterMenu=null; render(); }));
  $all('[data-checkresult-opt]').forEach(b=>b.addEventListener('click', ()=>{ state.filters.clientCheckResult=b.dataset.checkresultOpt; state.openFilterMenu=null; render(); }));
  $all('[data-kycmethod-opt]').forEach(b=>b.addEventListener('click', ()=>{ state.filters.clientKycMethod=b.dataset.kycmethodOpt; state.openFilterMenu=null; render(); }));
  $all('[data-country-opt]').forEach(b=>b.addEventListener('click', ()=>{ state.filters.clientPassportCountry=b.dataset.countryOpt; state.openFilterMenu=null; render(); }));

  /* export dropdown */
  $('#exportBtn')?.addEventListener('click', (e)=>{ e.stopPropagation(); state.exportOpen=!state.exportOpen; state.dateUI.open=false; state.openFilterMenu=null; render(); });
  $all('[data-export]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    const fmt = {csv:'CSV', xlsx:'Excel', pdf:'PDF'}[e.currentTarget.dataset.export];
    state.exportOpen=false; render(); toast(`Экспорт в ${fmt} запущен — ${filteredClients().length} строк`);
  }));

  /* date range popover */
  $('#dateRangeBtn')?.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(!state.dateUI.open){
      state.dateUI.viewMonth = state.filters.createdFrom || new Date();
      state.dateUI.tempFrom = state.filters.createdFrom; state.dateUI.tempTo = state.filters.createdTo;
    }
    state.dateUI.open = !state.dateUI.open; state.exportOpen=false; state.openFilterMenu=null; render();
  });
  $all('[data-calnav]').forEach(b=>b.addEventListener('click', ()=>{
    const dir = b.dataset.calnav==='prev' ? -1 : 1;
    const v = state.dateUI.viewMonth || new Date();
    state.dateUI.viewMonth = new Date(v.getFullYear(), v.getMonth()+dir, 1);
    render();
  }));
  $all('[data-day]').forEach(cell=>cell.addEventListener('click', ()=>{
    const [yy,mm,dd] = cell.dataset.day.split('-').map(Number);
    const picked = d0(yy,mm,dd);
    const u = state.dateUI;
    if(!u.tempFrom || (u.tempFrom && u.tempTo)){ u.tempFrom = picked; u.tempTo = null; }
    else { if(picked < u.tempFrom){ u.tempTo = u.tempFrom; u.tempFrom = picked; } else { u.tempTo = picked; } }
    render();
  }));
  $all('[data-quick]').forEach(b=>b.addEventListener('click', ()=>{
    const [from,to] = quickRanges()[b.dataset.quick];
    state.dateUI.tempFrom = from; state.dateUI.tempTo = to; state.dateUI.viewMonth = from;
    render();
  }));
  $('#dateReset')?.addEventListener('click', ()=>{
    state.filters.createdFrom=null; state.filters.createdTo=null; state.dateUI.open=false; render();
  });
  $('#dateApply')?.addEventListener('click', ()=>{
    state.filters.createdFrom = state.dateUI.tempFrom; state.filters.createdTo = state.dateUI.tempTo;
    state.dateUI.open=false; render();
  });
}

function bindClientDetail(){
  const c = clientById(state.currentClientId);
  $('#backToClients')?.addEventListener('click', ()=>{ state.view='external-list'; render(); });
  $('#btnUploadDoc')?.addEventListener('click', ()=>{
    c.docs = c.docs || [];
    const name = 'документ_'+(c.docs.length+1)+'.pdf';
    c.docs.push(name);
    logChange(c, 'Загрузка документа', '—', name, 'Загружен новый документ');
    render();
    toast('Документ загружен');
  });
  $all('[data-doc-preview]').forEach(el=>el.addEventListener('click', ()=>openDocPreviewModal(el.dataset.docPreview)));
  $all('[data-doc-download]').forEach(b=>b.addEventListener('click', ()=>toast('Скачивание: '+b.dataset.docDownload)));
  $all('[data-doc-delete]').forEach(b=>b.addEventListener('click', ()=>{
    const docName = b.dataset.docDelete;
    openConfirmModal({
      title:'Удалить документ?', body:`Файл «${docName}» будет удалён без возможности восстановления.`,
      confirmLabel:'Удалить', danger:true,
      onConfirm:(reason)=>{
        c.docs = (c.docs||[]).filter(d=>d!==docName);
        logChange(c, 'Удаление документа', docName, '—', reason);
        render(); toast('Документ удалён');
      }
    });
  }));

  $all('[data-rerun-check]').forEach(b=>b.addEventListener('click', ()=>{
    const code = b.dataset.rerunCheck;
    c.checks[code] = { status:'IN_PROGRESS', at: new Date().toLocaleString('ru-RU').slice(0,17) };
    render();
    toast('Проверка «'+code+'» перезапущена');
    setTimeout(()=>{
      c.checks[code] = { status:'SUCCESS', at: new Date().toLocaleString('ru-RU').slice(0,17) };
      if(Object.values(c.checks).every(s=>s.status==='SUCCESS')) c.checkResult='OK';
      render();
      toast('Проверка «'+code+'» пройдена');
    }, 1200);
  }));
  $('#btnRerunAllChecks')?.addEventListener('click', ()=>{
    const codes = Object.keys(c.checks||{});
    codes.forEach(code=>c.checks[code]={ status:'IN_PROGRESS', at: new Date().toLocaleString('ru-RU').slice(0,17) });
    render();
    toast('Все проверки перезапущены');
    setTimeout(()=>{
      codes.forEach(code=>c.checks[code]={ status:'SUCCESS', at: new Date().toLocaleString('ru-RU').slice(0,17) });
      c.checkResult='OK';
      render();
      toast('Все проверки пройдены');
    }, 1400);
  });
  $all('[data-goto-agent]').forEach(l=>l.addEventListener('click', (e)=>{
    e.preventDefault();
    const id = e.currentTarget.dataset.gotoAgent;
    if(!id) return;
    state.currentAgentId = id; state.accountDetailTab='kyc'; state.view='account-detail'; render();
  }));

  const toggleLabels = {
    sbpTopUp:'Пополнение по СБП', sbpTopUpFixed:'Фиксация «Пополнение по СБП»',
    qrTopUp:'Пополнение по QR',
    sbpWithdrawal:'Вывод по СБП', sbpWithdrawalFixed:'Фиксация «Вывод по СБП»',
  };
  $all('.switch[data-toggle]').forEach(sw=>sw.addEventListener('click', ()=>{
    const key = sw.dataset.toggle;
    const turningOn = !c[key];

    // Явное правило: РФ-паспорт без ИНН -> нет допуска к СБП. Ручное включение
    // оставляет след — кто включил и чего не хватает.
    if(key==='sbpTopUp' && turningOn && sbpInnBlockReason(c)){
      openConfirmModal({
        title:'Включить «Пополнение по СБП» без ИНН?',
        body:`У клиента российский паспорт и не заполнен ИНН — по правилу допуск к СБП должен быть закрыт. Включение вручную будет зафиксировано в истории с указанием, чего не хватает.`,
        confirmLabel:'Включить всё равно', danger:true,
        onConfirm:(reason)=>{
          c.sbpTopUp = true;
          logChange(c, toggleLabels.sbpTopUp, 'false', 'true', `${reason} (включено вручную при отсутствующем ИНН)`);
          render();
          toast('Пополнение по СБП включено вручную — несмотря на отсутствие ИНН');
        }
      });
      return;
    }

    c[key] = turningOn;
    logChange(c, toggleLabels[key]||key, String(!turningOn), String(turningOn), 'Изменено администратором в карточке клиента');
    render();
    toast(`${toggleLabels[key]||key}: ${turningOn?'включено':'выключено'}`);
  }));

  $('#btnLiftAntifraud')?.addEventListener('click', ()=>{
    openConfirmModal({
      title:'Снять блокировку антифрода?', body:'Счётчик неоплаченных QR будет обнулён, допуск к СБП разморожен.',
      confirmLabel:'Снять блокировку',
      onConfirm:(reason)=>{
        c.sbpBlockedByAntifraud = false; c.unpaidQrStreak = 0;
        logChange(c, 'Блокировка антифрода', 'true', 'false', reason);
        render(); toast('Блокировка антифрода снята');
      }
    });
  });

  $('#btnSavePaymentData')?.addEventListener('click', ()=>{
    c.autoWithdrawNetwork = $('#pdNetwork').value;
    c.autoWithdrawWallet = $('#pdWallet').value;
    render(); toast('Платёжные данные сохранены');
  });

  $all('[data-check]').forEach(b=>b.addEventListener('click', ()=>openCheckDetailsModal(b.dataset.check, c)));

  $('#btnEditClient')?.addEventListener('click', ()=>openEditClientModal(c));
  $('#btnDownloadNotification')?.addEventListener('click', ()=>toast('Формируется уведомление по клиенту…'));
  $('#btnMarkDelete')?.addEventListener('click', ()=>openMarkForDeletionModal(c));
  $('#btnRestrict')?.addEventListener('click', ()=>{
    openConfirmModal({title:'Ограничить клиента?', body:'Клиент перейдёт в статус RESTRICTED, допуски к пополнению будут заморожены до снятия ограничения.', confirmLabel:'Ограничить', danger:true,
      onConfirm:()=>{ c.statusBeforeRestriction=c.status; c.status='RESTRICTED'; render(); toast('Клиент ограничен'); }});
  });
  $('#btnUnrestrict')?.addEventListener('click', ()=>{
    openConfirmModal({title:'Снять ограничение?', body:'Клиент вернётся в предыдущий статус.', confirmLabel:'Снять ограничение',
      onConfirm:()=>{ c.status=c.statusBeforeRestriction||'ACTIVE'; render(); toast('Ограничение снято'); }});
  });
  $('#btnApproveDeletion')?.addEventListener('click', ()=>{
    openConfirmModal({title:'Согласовать удаление?', body:'Клиент будет переведён в статус ARCHIVED. Действие необратимо в интерфейсе.', confirmLabel:'Согласовать', danger:true,
      onConfirm:()=>{ c.status='ARCHIVED'; c.deletionRequested=false; render(); toast('Клиент архивирован'); }});
  });
  $('#btnRejectDeletion')?.addEventListener('click', ()=>{
    openConfirmModal({title:'Отклонить заявку на удаление?', body:'Клиент останется активным, заявка будет закрыта как отклонённая.', confirmLabel:'Отклонить',
      onConfirm:()=>{ c.deletionRequested=false; render(); toast('Заявка на удаление отклонена'); }});
  });
  $('#btnCancelDeletion')?.addEventListener('click', ()=>{ c.deletionRequested=false; render(); toast('Заявка на удаление отменена'); });
}

/* =========================================================================
   MODALS
   ========================================================================= */
function openModal(html, wide){
  $('#modalBox').className = 'modal' + (wide?' wide':'');
  $('#modalBox').innerHTML = html;
  $('#overlay').classList.add('show');
  $all('[data-close-modal]').forEach(b=>b.addEventListener('click', closeModal));
}
function closeModal(){ $('#overlay').classList.remove('show'); $('#modalBox').innerHTML=''; }
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });

function openConfirmModal({title, body, confirmLabel, danger, onConfirm}){
  openModal(`
    <div class="modal-h"><h3>${esc(title)}</h3><button class="modal-x" data-close-modal>✕</button></div>
    <div class="modal-b"><div style="font-size:13px;color:var(--text-sub)">${esc(body)}</div>
      <div class="field"><label>Причина <span class="req">*</span></label><textarea rows="2" id="confirmReason" placeholder="Обязательно — попадёт в журнал изменений"></textarea></div>
    </div>
    <div class="modal-f"><button class="btn" data-close-modal>Отмена</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="confirmOk">${esc(confirmLabel)}</button></div>
  `);
  $('#confirmOk').addEventListener('click', ()=>{
    const reason = $('#confirmReason').value.trim();
    if(!reason){ $('#confirmReason').style.borderColor='var(--error)'; toast('Укажите причину'); return; }
    closeModal(); onConfirm(reason);
  });
}

function openDocPreviewModal(name){
  const isImg = !name.endsWith('.pdf');
  openModal(`
    <div class="modal-h"><h3>${esc(name)}</h3><button class="modal-x" data-close-modal>✕</button></div>
    <div class="modal-b">
      <div class="doc-preview-box">${isImg?'🖼️':'📄'}</div>
      <div class="ts" style="text-align:center">Предпросмотр недоступен в прототипе — в реальной системе здесь отрисовывается содержимое файла</div>
    </div>
    <div class="modal-f"><button class="btn" data-close-modal>Закрыть</button><button class="btn btn-primary" data-doc-download="${esc(name)}" id="previewDownload">Скачать</button></div>
  `);
  $('#previewDownload').addEventListener('click', ()=>toast('Скачивание: '+name));
}

      toast('При иностранном документе обязательны «Фамилия как в документе» и «Имя как в документе»'); return;
    }
    const changedIdentity = c.lastName!==$('#ecLast').value || c.firstName!==$('#ecFirst').value ||
      c.phoneNumber!==$('#ecPhone').value || c.passportNumber!==$('#ecPassport').value || c.birthDate!==$('#ecBirth').value ||
      c.inn!==$('#ecInn').value;

    c.lastName=$('#ecLast').value; c.firstName=$('#ecFirst').value; c.middleName=$('#ecMiddle').value;
    c.email=$('#ecEmail').value; c.phoneNumber=$('#ecPhone').value;
    c.inn=$('#ecInn').value; c.passportNumber=$('#ecPassport').value; c.passportIssuedDate=$('#ecPassportDate').value;
    c.birthDate=$('#ecBirth').value; c.passportIssuingCountry=country;
    c.lastNameNative=$('#ecLastNative').value; c.firstNameNative=$('#ecFirstNative').value;
    c.registrationAddress = {
      country: $('#ecAddrCountry').value, postIndex: $('#ecAddrIndex').value, state: $('#ecAddrState').value,
      city: $('#ecAddrCity').value, cityEn: $('#ecAddrCityEn').value,
      street: $('#ecAddrStreet').value, streetEn: $('#ecAddrStreetEn').value, streetExtra: $('#ecAddrExtra').value,
      buildingName: $('#ecAddrBuilding').value, buildingNumber: $('#ecAddrHouse').value, flatNumber: $('#ecAddrFlat').value,
    };
    c.sbpTopUp = $('#ecSbp').classList.contains('on');
    c.qrTopUp = $('#ecQr').classList.contains('on');
    if(changedIdentity){ c.sbpTopUp=false; c.checkResult='PENDING'; c.status='PENDING'; }
    closeModal(); render();
    toast(changedIdentity ? 'Сохранено — важные данные изменены, проверки перезапущены' : 'Сохранено');
  });
}

function openMarkForDeletionModal(c){
  openModal(`
    <div class="modal-h"><h3>Пометить к удалению</h3><button class="modal-x" data-close-modal>✕</button></div>
    <div class="modal-b">
      <div class="field"><label>Причина <span class="req">*</span></label><textarea rows="3" id="mdReason" placeholder="Например: клиент запросил закрытие счёта у партнёра"></textarea></div>
    </div>
    <div class="modal-f"><button class="btn" data-close-modal>Отмена</button><button class="btn btn-danger" id="mdSave">Пометить к удалению</button></div>
  `);
  $('#mdSave').addEventListener('click', ()=>{
    if(!$('#mdReason').value.trim()){ toast('Укажите причину'); return; }
    c.deletionRequested = true;
    deletionRequests[c.id] = [{status:'PENDING', requestedBy:'Super Admin', requestedAt: new Date().toLocaleString('ru-RU').slice(0,17)}];
    closeModal(); render(); toast('Клиент помечен к удалению — ожидает согласования');
  });
}

function openCheckDetailsModal(code, c){
  const meta = CHECK_TYPES.find(t=>t.code===code);
  const sample = checkDetailSamples[code] || {request:{last_name:c.lastName, first_name:c.firstName}, response:{passed:true, result:'ok'}};
  openModal(`
    <div class="modal-h"><h3>Детали проверки · ${meta?meta.label:code}</h3><button class="modal-x" data-close-modal>✕</button></div>
    <div class="modal-b">
      <div class="deflist" style="grid-template-columns:1fr 1fr">
        <div><dt>Тип</dt><dd class="mono" style="font-size:11.5px">${code}</dd></div>
        <div><dt>Статус</dt><dd>${checkStatusBadge(((c.checks||{})[code]||{}).status)}</dd></div>
        <div><dt>Когда</dt><dd class="mono" style="font-size:11.5px">${esc(((c.checks||{})[code]||{}).at||'—')}</dd></div>
      </div>
      <div><div class="section-num" style="margin-bottom:6px"><span class="n">→</span>Запрос</div><div class="jsonbox">${esc(JSON.stringify(sample.request,null,2))}</div></div>
      <div><div class="section-num" style="margin-bottom:6px"><span class="n">←</span>Ответ</div><div class="jsonbox">${esc(JSON.stringify(sample.response,null,2))}</div></div>
    </div>
    <div class="modal-f"><button class="btn btn-primary" data-close-modal>Закрыть</button></div>
  `, true);
}
